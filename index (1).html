<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Hero’s Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1B3D; --muted:#6E5E8C; --pill:rgba(255,255,255,.88); --pill-ink:#2A1B3D;
  --pink:#FF5FA8; --pink-deep:#D63C86; --grape:#6B3FD1; --grape-deep:#4E2AA6; --sky:#5CC8FF; --sun:#FFC23C; --mint:#2BCB8B;
  --panel:#FFFFFF; --panel-ink:#2A1B3D;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--pill:rgba(37,26,66,.88);--pill-ink:#F4EEFF;--panel:#251A42;--panel-ink:#F4EEFF;--muted:#B7A8D9;color-scheme:dark}
}
:root[data-theme="dark"]{--pill:rgba(37,26,66,.88);--pill-ink:#F4EEFF;--panel:#251A42;--panel-ink:#F4EEFF;--muted:#B7A8D9;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#9ED8FF}
body{font:600 16px/1.4 "Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:6px 14px;font-weight:800;font-size:1.35rem;line-height:1.2;box-shadow:0 3px 0 rgba(42,27,61,.18);backdrop-filter:blur(8px)}
.bars{flex:1;max-width:340px;background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:6px 12px 8px;box-shadow:0 3px 0 rgba(42,27,61,.18);backdrop-filter:blur(8px)}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.85rem;font-weight:800}
.bar + .bar{margin-top:3px}
.bar .tr{height:10px;border-radius:10px;background:rgba(110,94,140,.25);overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:10px;background:var(--pink);transition:width .4s ease}
.bar.lora .tr i{background:#FF8A3D}
.bar.lora{opacity:.85;font-size:.78rem}
.hud-btns{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--pill);font-size:1.4rem;box-shadow:0 3px 0 rgba(42,27,61,.18)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%) translateY(-8px);background:var(--panel);color:var(--panel-ink);padding:10px 18px;border-radius:18px;font-weight:800;font-size:1.05rem;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 0 rgba(42,27,61,.15);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:6}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* touch controls */
#controls{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:auto auto;grid-template-areas:"wish dash" "jump jump";gap:12px;z-index:5;justify-items:end}
.act{border:0;border-radius:50%;width:72px;height:72px;display:grid;place-items:center;align-content:center;color:#fff;font-size:1.6rem;line-height:1;touch-action:none}
.act small{display:block;font-size:.8rem;margin-top:2px;font-weight:800}
#jumpBtn{grid-area:jump;width:92px;height:92px;font-size:2rem;background:var(--pink);box-shadow:0 6px 0 var(--pink-deep)}
#dashBtn{grid-area:dash;background:#3FA7E8;box-shadow:0 5px 0 #2577AE}
#wishBtn{grid-area:wish;background:var(--grape);box-shadow:0 5px 0 var(--grape-deep)}
.act:active,.act.down{transform:translateY(4px);box-shadow:none!important}
.act[aria-disabled="true"]{filter:grayscale(.7);opacity:.6}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.7);display:none;z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(42,27,61,.2)}
#joyHint{position:fixed;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:110px;height:110px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;font-size:.85rem;pointer-events:none;z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.35)}
@media (hover:hover) and (pointer:fine){#joyHint{display:none}}

#wishMenu{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:12px;display:grid;gap:8px;z-index:7;width:min(260px,80vw);box-shadow:0 8px 0 rgba(42,27,61,.15)}
#wishMenu[hidden]{display:none}
#wishMenu h3{margin:0 4px 2px;font-size:1.1rem}
#wishMenu button{border:0;border-radius:14px;padding:10px 12px;text-align:left;background:rgba(107,63,209,.12);font-weight:800;font-size:1rem}
#wishMenu button span{display:block;font-weight:600;font-size:.82rem;color:var(--muted)}

/* screens */
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(120% 90% at 50% 20%,rgba(255,214,236,.92),rgba(158,216,255,.94));overflow:auto}
.screen[hidden]{display:none}
.card{background:var(--panel);color:var(--panel-ink);border-radius:32px;padding:26px 24px;max-width:480px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(42,27,61,.12)}
.script{font-family:"Pacifico","Snell Roundhand","Brush Script MT",cursive;font-weight:400;color:var(--pink)}
.byline{font-size:1.5rem;display:inline-block;transform:rotate(-3deg);margin-bottom:2px}
.card h1{font:800 clamp(2.4rem,10vw,3.4rem)/1 "Baloo 2",system-ui,sans-serif;margin:4px 0 12px;color:var(--grape)}
.card p{margin:0 0 12px;font-weight:600;font-size:1.05rem}
.card ul{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:6px;text-align:left;font-weight:600}
.card li{background:rgba(107,63,209,.08);border-radius:14px;padding:8px 12px}
.big{border:0;border-radius:20px;padding:14px 28px;font:800 1.35rem/1 "Baloo 2",system-ui,sans-serif;background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-deep)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
.needs-js{font-size:.95rem;color:var(--muted)}
body.js .needs-js{display:none}
body:not(.js) .big{display:none}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:9}
#fade.on{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
#confetti span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:520px){#hud{flex-wrap:wrap}.bars{order:3;flex-basis:100%;max-width:none}.mode-star #toast{top:calc(env(safe-area-inset-top,0px) + 136px)}.pill{font-size:1.15rem;padding:6px 10px}.round{width:42px;height:42px;font-size:1.2rem}}
/* modes */
.mode-ctf .star-only{display:none!important}
.mode-star .ctf-only{display:none!important}
#ctfHud{flex:1;max-width:360px;text-align:center;font-size:1.15rem;padding:6px 12px}
#ctfHud .row{display:flex;justify-content:center;gap:14px}
#ctfStatus{font-size:.85rem;font-weight:700;opacity:.85}
#ctxBtn{grid-area:wish;background:#FF8A3D;box-shadow:0 5px 0 #C9601F}
#redTint{position:fixed;inset:0;background:rgba(255,50,80,.32);mix-blend-mode:multiply;opacity:0;transition:opacity .35s;pointer-events:none;z-index:2}
#redTint.on{opacity:1}
#count{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:800 9rem/1 "Baloo 2",system-ui,sans-serif;color:#fff;text-shadow:0 6px 0 var(--pink-deep),0 0 30px rgba(42,27,61,.35);pointer-events:none;z-index:7}
#count.pop{animation:pop .8s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1.8);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
#readyBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 270px);transform:translateX(-50%);z-index:6;white-space:nowrap}
#readyBtn[hidden]{display:none}
.modes{display:grid;gap:12px;margin:16px 0 8px}
.mode{border:0;border-radius:22px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:rgba(107,63,209,.1);color:var(--panel-ink)}
.mode .ic{grid-row:span 2;font-size:2.2rem}
.mode b{font-size:1.3rem;line-height:1.1;display:block}
.mode span:not(.ic){font-size:.92rem;font-weight:600;color:var(--muted);line-height:1.3;display:block}
.mode:first-child b{color:var(--pink)}.mode:last-child b{color:#3FA7E8}
body:not(.js) .mode{display:none}
.card .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.ghostbtn{border:0;background:none;font-weight:800;color:var(--muted);font-size:1.1rem;padding:12px}
/* hide and seek */
.mode-hs .star-only,.mode-hs .ctf-only,.mode-hs .no-hs{display:none!important}
body:not(.mode-hs) .hs-only{display:none!important}
#hsTop{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:6px 14px 8px;box-shadow:0 3px 0 rgba(42,27,61,.18);max-width:calc(100vw - 190px);backdrop-filter:blur(8px)}
#hsTimer{font:800 1.8rem/1.05 "Baloo 2",system-ui,sans-serif}
#hsTimer.hurry{color:#FF2D55;animation:hurry .5s infinite alternate}
@keyframes hurry{to{transform:scale(1.08)}}
#hsPhase{font-weight:800;font-size:.95rem;line-height:1.2}
#hsFound{font-size:.78rem;font-weight:700;opacity:.85;line-height:1.2}
#hsMeter{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 118px);z-index:5;background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:8px 14px;width:min(330px,92vw);text-align:center;font-weight:800;box-shadow:0 4px 0 rgba(42,27,61,.15)}
#hsMeter .hc{height:12px;border-radius:12px;background:rgba(110,94,140,.25);overflow:hidden;margin-top:6px}
#hsHC{display:block;height:100%;width:10%;border-radius:12px;transition:width .3s}
#hsCross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);z-index:4;pointer-events:none}
#hsAct{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:6;max-width:62vw;font-size:1.15rem;line-height:1.15}
#hsView{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:6;border:0;border-radius:18px;padding:12px 16px;background:var(--grape);color:#fff;font:800 1.05rem "Baloo 2",system-ui,sans-serif;box-shadow:0 5px 0 var(--grape-deep)}
#hsCount{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:800 2.4rem/1.1 "Baloo 2",system-ui,sans-serif;color:#fff;text-shadow:0 4px 0 var(--pink-deep),0 0 24px rgba(42,27,61,.5);z-index:5;pointer-events:none;text-align:center;width:90vw}
#hsRole{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);z-index:7;background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:12px 16px;text-align:center;box-shadow:0 6px 0 rgba(42,27,61,.15);width:min(340px,92vw);font-weight:800}
#hsRole .row2 button{font-size:1.05rem;padding:10px 16px}
#hsAct[hidden],#hsView[hidden],#hsMeter[hidden],#hsCount[hidden],#hsRole[hidden],#hsCross[hidden]{display:none!important}
.mode-hs #toast{top:calc(env(safe-area-inset-top,0px) + 112px)}
.mode:nth-child(3) b{color:#FF8A3D}
</style>
</head>
<body class="mode-star">
<canvas id="game"></canvas>

<div id="hud">
  <div class="pill star-only" id="carried" aria-label="Stars you are carrying">⭐ 0</div>
  <div class="pill ctf-only" id="ctfHud"><div class="row"><span id="ctfScore">🔵 0 – 0 🔴</span><span id="ctfTime">⏱ 4:00</span></div><div id="ctfStatus"></div></div>
  <div class="bars star-only">
    <div class="bar"><span>🏰 Mansion</span><div class="tr"><i id="mBar"></i></div><b id="mTxt">0/25</b></div>
    <div class="bar lora"><span>😤 Lora’s tower</span><div class="tr"><i id="lBar"></i></div><b id="lTxt">0/25</b></div>
  </div>
  <div class="hud-btns"><button class="round" id="homeBtn" aria-label="Main menu">🏠</button><button class="round" id="moodBtn" aria-label="Change the weather">😊</button><button class="round" id="soundBtn" aria-label="Sound on or off">🔊</button></div>
</div>
<div id="toast" role="status"></div>
<div id="joyHint">Drag here<br>to move</div>
<div id="joy"><div id="knob"></div></div>
<div id="controls" class="no-hs">
  <button class="act ctf-only" id="ctxBtn" aria-label="Plant flag or call for help">🚩<small>Plant</small></button>
  <button class="act star-only" id="wishBtn" aria-label="Magic necklace wish">💎<small>Wish</small></button>
  <button class="act" id="dashBtn" aria-label="Super dash">💨<small>Dash</small></button>
  <button class="act" id="jumpBtn" aria-label="Jump or fly">⬆️<small>Jump</small></button>
</div>
<div id="wishMenu" hidden>
  <h3>💎 Magic necklace: make a…</h3>
  <button data-wish="mushroom">🍄 Bounce mushroom<span>Jump on it to fly super high</span></button>
  <button data-wish="rainbow">🌈 Speed rainbow<span>Run over it for super speed</span></button>
  <button data-wish="magnet">🧲 Star magnet<span>Pulls nearby stars to you</span></button>
</div>

<div class="screen" id="screen">
  <div class="card" id="screenCard">
    <span class="script byline">by Lola 🩵</span>
    <h1>The Hero’s Dream</h1>
    <p>Pick a game:</p>
    <div class="modes">
      <button class="mode" data-mode="star"><span class="ic">⭐</span><b>Star Mansion</b><span>Collect stars and build Leaha’s mansion before Lora finishes her tower!</span></button>
      <button class="mode" data-mode="ctf"><span class="ic">🚩</span><b>Capture the Flag</b><span>7 on 7 against Lora’s team, with Cardi B on your side!</span></button>
      <button class="mode" data-mode="hs"><span class="ic">🙈</span><b>Hide and Seek</b><span>Race into the mansion and hide! 4 blue vs 4 red.</span></button>
    </div>
    <p class="needs-js">To play, open this game from a web link in Chrome or Safari.</p>
  </div>
</div>
<div id="fade"></div>
<div id="confetti"></div>
<div id="redTint"></div>
<div id="hsTop" class="hs-only"><div id="hsTimer">⏱ 0:45</div><div id="hsPhase"></div><div id="hsFound"></div></div>
<div id="hsMeter" class="hs-only" hidden><div id="hsFeet"></div><div class="hc"><i id="hsHC"></i></div></div>
<div id="hsCross" class="hs-only" hidden></div>
<div id="hsCount" class="hs-only" hidden></div>
<button class="big hs-only" id="hsAct" hidden></button>
<button class="hs-only" id="hsView" hidden>👻 Follow the seeker</button>
<div id="hsRole" class="hs-only" hidden>Next round I want to be:<div class="row2" style="margin-top:8px"><button class="big" data-hsnext="hider">🙈 Hider</button><button class="big" data-hsnext="seeker" style="background:#3FA7E8;box-shadow:0 6px 0 #2577AE">🔍 Seeker</button></div></div>
<div id="count"></div>
<button class="big" id="readyBtn" hidden>I’m ready! Start the countdown</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
document.body.classList.add("js");
const $=s=>document.querySelector(s);
const GOAL=25,PI=Math.PI;

/* ---------- renderer & scene ---------- */
const canvas=$("#game");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){$("#screenCard").innerHTML="<h1>Oops!</h1><p>This game needs 3D graphics, which this browser can’t show. Try Chrome or Safari.</p>";return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(58,1,.1,400);
scene.fog=new THREE.Fog(0x9ED8FF,70,170);
scene.background=new THREE.Color(0x9ED8FF);
const hemi=new THREE.HemisphereLight(0xffffff,0x7fcf6a,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(30,50,20);scene.add(sun);
const grad=new THREE.DataTexture(new Uint8Array([100,180,240]),3,1,THREE.LuminanceFormat);grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.generateMipmaps=false;grad.needsUpdate=true;

const toon=c=>new THREE.MeshToonMaterial({color:new THREE.Color(c),gradientMap:grad});
const basic=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:new THREE.Color(c)},o||{}));
const shade=(c,l)=>{const x=new THREE.Color(c);x.offsetHSL(0,0,l);return x};
function M(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o}
const cyl=(a,b,h,s,o,ts,tl)=>new THREE.CylinderGeometry(a,b,h,s||16,1,o,ts,tl);
const sph=(r,w,h,a,b,c,d)=>new THREE.SphereGeometry(r,w||16,h||12,a,b,c,d);
function starShape(o,i){const s=new THREE.Shape();for(let k=0;k<10;k++){const r=k%2?i:o,a=PI/2+k*PI/5;k?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r)}s.closePath();return s}
function label(text,bg){
  const c=document.createElement("canvas");c.width=512;c.height=128;const x=c.getContext("2d");
  x.font="800 64px 'Baloo 2', system-ui, sans-serif";const w=Math.min(500,x.measureText(text).width+60);
  x.fillStyle=bg||"#FFFFFF";x.beginPath();const l=(512-w)/2;x.moveTo(l+40,14);x.arcTo(l+w,14,l+w,114,40);x.arcTo(l+w,114,l,114,40);x.arcTo(l,114,l,14,40);x.arcTo(l,14,l+w,14,40);x.fill();
  x.fillStyle="#2A1B3D";x.textAlign="center";x.textBaseline="middle";x.fillText(text,256,68);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthWrite:false}));s.scale.set(4,1,1);return s;
}

/* ---------- characters ---------- */
function makeChar(o){
  const g=new THREE.Group();
  const skin=toon(o.skin),cloth=toon(o.outfitColor),pants=toon(o.pants||shade(o.outfitColor,-.22)),dark=toon("#2A1B3D"),pink=toon("#FF8FC4"),hairM=toon(o.hairColor);hairM.side=THREE.DoubleSide;
  const legs=[];
  [-1,1].forEach(s=>{const p=new THREE.Group();p.position.set(s*.18,.75,0);p.add(M(cyl(.14,.13,.62,12),o.outfit==="dress"?skin:pants,0,-.33,0));const sh=M(sph(.17,12,10),dark,0,-.66,.06);sh.scale.set(1,.6,1.35);p.add(sh);g.add(p);legs.push(p)});
  if(o.outfit==="dress")g.add(M(cyl(.32,.74,1.0,20),cloth,0,1.0,0));else g.add(M(cyl(.36,.42,.8,20),cloth,0,1.1,0));
  const shd=M(sph(.37,20,12),cloth,0,1.47,0);shd.scale.set(1.05,.45,.85);g.add(shd);
  if(o.outfit==="hoodie"){const hood=M(new THREE.TorusGeometry(.25,.09,8,20),cloth,0,1.55,-.2);hood.rotation.x=PI/2.3;g.add(hood);if(!o.belly)g.add(M(new THREE.BoxGeometry(.42,.18,.06),toon(shade(o.outfitColor,-.1)),0,.92,.4))}

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;nowT=t;
  if(G.playing)update(dt,t);
  ambient(dt,t);
  // camera
  if(G.mode==="hs"){hsCamera(dt);if(toastT>0){toastT-=dt;if(toastT<=0)$("#toast").classList.remove("on")}renderer.render(scene,camera);requestAnimationFrame(frame);return}
  const ct=camTarget();
  if(G.inVault&&G.mode!=="ctf"){const dx=ct.x-V.x,dz=ct.z-V.z,d=Math.hypot(dx,dz);if(d>10.5){ct.x=V.x+dx/d*10.5;ct.z=V.z+dz/d*10.5}}
  camPos.lerp(ct,Math.min(1,6*dt));if(camPos.y<1.5)camPos.y=1.5;camera.position.copy(camPos);
  camera.lookAt(hero.position.x,hero.position.y+2,hero.position.z);
  if(toastT>0){toastT-=dt;if(toastT<=0)$("#toast").classList.remove("on")}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function update(dt,t){
  G.time+=dt;
  if(G.mode==="hs"){hsUpdate(dt,t);return}
  // timers
  ["dashT","dashCD","speedT","sickT","magnetT","wishCD","doorCD","manualT","eCD","lPause","cardiCD","superT"].forEach(k=>{if(G[k]>0)G[k]=Math.max(0,G[k]-dt)});
  if(G.magnetT<=0)magnetRing.visible=false;
  // input
  let ix=0,iz=0;
  if(keys["a"]||keys["arrowleft"])ix-=1;if(keys["d"]||keys["arrowright"])ix+=1;
  if(keys["w"]||keys["arrowup"])iz+=1;if(keys["s"]||keys["arrowdown"])iz-=1;
  if(joy.id!==null){ix+=joy.x;iz-=joy.y}
  const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il}
  const fwdX=-Math.sin(G.camYaw),fwdZ=-Math.cos(G.camYaw),rtX=Math.cos(G.camYaw),rtZ=-Math.sin(G.camYaw);
  const dx=fwdX*iz+rtX*ix,dz=fwdZ*iz+rtZ*ix,mag=Math.hypot(dx,dz);
  const ctfMode=G.mode==="ctf",canMove=!ctfMode||P.frozenT<=0;
  let speed=9*(G.speedT>0?1.8:1)*(G.dashT>0?2.4:1)*(G.sickT>0?.6:1)*(ctfMode&&P.speedT>0?1.7:1)*(canMove?1:0);
  if(mag>.05){
    hero.position.x+=dx*speed*dt;hero.position.z+=dz*speed*dt;
    G.heroYaw=Math.atan2(dx,dz);
    if(G.manualT<=0&&iz>-.3)G.camYaw=lerpAngle(G.camYaw,G.heroYaw+PI,1.6*dt*Math.min(1,mag));
  }else if(G.dashT>0){hero.position.x+=Math.sin(G.heroYaw)*speed*dt;hero.position.z+=Math.cos(G.heroYaw)*speed*dt}
  hero.rotation.y=lerpAngle(hero.rotation.y,G.heroYaw,14*dt);
  // jump / fly
  if(jumpQueued){jumpQueued=false;
    if(!canMove){}
    else if(G.sickT>0){if(G.grounded){G.vy=6;G.grounded=false;G.jumps=2}}
    else if(G.grounded){G.vy=G.superT>0?19:12;G.grounded=false;G.jumps=1;chime([660],0,.12,"triangle",.08)}
    else if(G.jumps<2){G.vy=11;G.jumps=2;chime([880],0,.12,"triangle",.08)}}
  G.vy-=30*dt;
  if(jumpHeld&&G.sickT<=0&&!G.grounded&&G.vy<0)G.vy=Math.max(G.vy,-3);
  hero.position.y+=G.vy*dt;
  if(hero.position.y<=0){hero.position.y=0;G.vy=0;G.grounded=true;G.jumps=0}
  if(ctfMode)confine(P);
  else if(G.inVault){const vx=hero.position.x-V.x,vz=hero.position.z-V.z,d=Math.hypot(vx,vz);if(d>11){hero.position.x=V.x+vx/d*11;hero.position.z=V.z+vz/d*11}}
  else resolve(hero.position,.55);
  const moving=Math.min(1,mag*(G.dashT>0?1.5:1));
  animChar(hero,G.grounded?moving:.15,t,dt);
  hero.userData.body.position.x=G.sickT>0?Math.sin(t*40)*.06:0;
  if(!G.grounded){hero.userData.arms[0].rotation.z=-1.2;hero.userData.arms[1].rotation.z=1.2}else{hero.userData.arms.forEach(a=>a.rotation.z+=(a.userData.base-a.rotation.z)*.2)}
  // buddy star
  buddy.position.set(hero.position.x+Math.sin(t*1.4)*1.3,hero.position.y+2.8+Math.sin(t*2.3)*.2,hero.position.z+Math.cos(t*1.4)*1.3);buddy.rotation.y=t*2;
  if(ctfMode){ctfUpdate(dt,t);updateHUD();return}
  // stars
  const hc=hero.position.y+1.2;
  stars.forEach(s=>{
    if(!s.active){s.t-=dt;if(s.t<=0)placeStar(s);return}
    s.m.rotation.y+=2*dt;s.m.position.y=s.base+Math.sin(t*2+s.m.position.x)*.2;
    if(G.inVault)return;
    if(G.magnetT>0){const ddx=hero.position.x-s.m.position.x,ddz=hero.position.z-s.m.position.z,d=Math.hypot(ddx,ddz);if(d<14&&d>.1){s.m.position.x+=ddx/d*14*dt;s.m.position.z+=ddz/d*14*dt;s.base+=(1.3-s.base)*3*dt}}
    if(Math.hypot(hero.position.x-s.m.position.x,hero.position.z-s.m.position.z)<1.5&&Math.abs(hc-s.m.position.y)<1.8){collect(s);G.carried++;chime([1319,1760],.05,.2,"sine",.1);if(G.carried===1&&G.delivered===0)toast("Bring your stars to the pink light: Leaha’s Mansion! 🏰")}
  });
  // wished objects
  wished.forEach(w=>{if(w.grow<1){w.grow=Math.min(1,w.grow+dt*3);w.obj.scale.setScalar(.01+w.grow*.99)}
    const d=Math.hypot(hero.position.x-w.obj.position.x,hero.position.z-w.obj.position.z);
    if(w.kind==="mushroom"&&d<1.9&&hero.position.y<2.4&&G.vy<=0&&!G.inVault){G.vy=26;G.grounded=false;G.jumps=1;chime([300,600,1200],.05,.25,"triangle",.1);w.obj.scale.y=.7;setTimeout(()=>w.obj.scale.y=1,120)}
    if(w.kind==="rainbow"&&d<2.1&&hero.position.y<1&&G.speedT<3.5){G.speedT=4;chime([784,1047,1319],.04,.2,"sine",.08);toast("Super speed! 🌈💨",1200)}
  });
  // delivery
  if(!G.inVault&&G.carried>0&&Math.hypot(hero.position.x-MS.x,hero.position.z-MS.z)<12.5){
    const before=G.delivered;G.delivered=Math.min(GOAL,G.delivered+G.carried);G.carried=0;
    const stage=Math.floor(G.delivered/5);
    mansion.stages.forEach((s,i)=>s.visible=i<stage);
    if(stage>=2&&colBoxes.length===1)colBoxes.push({x1:MS.x-7.2,x2:MS.x+7.2,z1:MS.z-5.2,z2:MS.z+5.2});
    if(stage>=4&&!G.towersCol){G.towersCol=true;colCircles.push({x:MS.x-8,z:MS.z+5,r:1.8},{x:MS.x+8,z:MS.z+5,r:1.8})}
    if(stage>=5)colCircles.push({x:MS.x,z:MS.z+9,r:2.5});
    family.forEach(f=>f.userData.cheer=1.2);
    chime([784,988,1175,1568],.08,.35);
    const names=["the floor","the walls","the roof","the towers","the fountain and door"];
    if(Math.floor(before/5)<stage)toast(`Mom & Dad: You built ${names[stage-1]}! We’re so proud! 🏗️🩵`,2800);else toast(`Mom & Dad: Great job! ${G.delivered}/${GOAL} stars 🩵`);
    if(before<10&&G.delivered>=10&&!hero.userData.looks.wings.visible){hero.userData.looks.wings.visible=true;setTimeout(()=>toast("✨ New look unlocked: fairy wings! ✨",3000),2900)}
    if(G.delivered>=GOAL){mansion.scaffold.visible=false;mansion.beacon.visible=false;toast("The mansion is DONE! 🏰✨",3000);win()}
  }
  // secret door & vault
  if(!G.inVault&&G.doorCD<=0&&heroDist(door)<2.4)enterVault();
  if(G.inVault){
    if(!G.chestOpen&&Math.hypot(hero.position.x-V.x,hero.position.z-(V.z-9))<2.4){G.chestOpen=true;G.carried+=5;hero.userData.looks.crown.visible=true;chime([1047,1319,1568,2093,2637],.08,.5);toast("💎 Treasure chest! +5 stars and a new look: a golden crown! 👑",3400)}
    if(G.chestOpen&&vault.lid.rotation.x>-1.6)vault.lid.rotation.x-=dt*3;
    if(G.doorCD<=0&&Math.hypot(hero.position.x-V.x,hero.position.z-(V.z+9.5))<2)exitVault();
  }
  G.hintT-=dt;if(G.hintT<=0&&!G.chestOpen){G.hintT=90;toast("Psst… there’s a secret door somewhere behind the magic school 🗝️",3200)}
  // sneeze clouds
  for(let i=clouds2.length-1;i>=0;i--){const c=clouds2[i];c.life-=dt;c.obj.rotation.y+=dt;c.obj.children.forEach((s,k)=>s.position.y=1.4+Math.sin(t*3+k)*.25);
    if(c.life<=0){scene.remove(c.obj);clouds2.splice(i,1);continue}
    if(!G.inVault&&G.sickT<=0&&heroDist(c.obj)<2.1&&hero.position.y<3){G.sickT=3;$("#wishMenu").hidden=true;chime([300,180],.12,.3,"square",.06);toast("Achoo! 🤧 School rule: when you’re sick, no magic! (3 seconds)",2600)}}
  updateEloise(dt,t);updateLora(dt,t);updateCardi(dt,t);
  updateHUD();
}
function updateCardi(dt,t){
  const c=cardi;G.cT=(G.cT||0)-dt;
  if(G.cT<=0||!G.cTarget||Math.hypot(c.position.x-G.cTarget.x,c.position.z-G.cTarget.z)<1){G.cT=4+Math.random()*4;const a=Math.random()*PI*2,r=4+Math.random()*12;G.cTarget={x:4+Math.cos(a)*r,z:4+Math.sin(a)*r}}
  const d=moveToward(c,G.cTarget.x,G.cTarget.z,2.6,dt);animChar(c,d>.1?.8:0,t*.9,dt);
  if(!G.inVault&&G.cardiCD<=0&&heroDist(c)<1.7){G.cardiCD=20;G.carried++;G.speedT=3;chime([523,784,1047],.07,.3);toast("Cardi B: Belly bump boost! 💅 +1 star and super speed!",2600)}
}
function collect(s){s.active=false;s.m.visible=false;s.t=1.5}
function updateEloise(dt,t){
  const e=eloise;G.eT-=dt;let sp=0;
  if(G.eState==="wander"){
    if(G.eT<=0||Math.hypot(e.position.x-G.eTarget.x,e.position.z-G.eTarget.z)<1){const a=Math.random()*PI*2,r=8+Math.random()*40;G.eTarget={x:Math.cos(a)*r,z:Math.sin(a)*r};if(G.eT<=0&&!G.inVault&&Math.random()<.55){G.eState="chase";G.eT=5}else G.eT=4+Math.random()*3}
    sp=4.2;moveToward(e,G.eTarget.x,G.eTarget.z,sp,dt);
  }else if(G.eState==="chase"){
    sp=7.2;moveToward(e,hero.position.x,hero.position.z,sp,dt);if(G.eT<=0){G.eState="wander";G.eT=5}
  }else if(G.eState==="flee"){
    const ax=e.position.x-hero.position.x,az=e.position.z-hero.position.z,d=Math.hypot(ax,az)||1;sp=8.5;moveToward(e,e.position.x+ax/d*5,e.position.z+az/d*5,sp,dt);if(G.eT<=0){G.eState="wander";G.eT=4}
  }
  animChar(e,Math.min(1,sp/6),t*1.2,dt);
  G.cloudT-=dt;if(G.cloudT<=0&&clouds2.length<3){G.cloudT=13+Math.random()*5;const g=new THREE.Group();const cm=basic("#9BE37A",{transparent:true,opacity:.55,depthWrite:false});for(let k=0;k<4;k++)g.add(M(sph(.7,10,8),cm,Math.cos(k)*.7,1.4,Math.sin(k)*.7));g.position.set(e.position.x,0,e.position.z);scene.add(g);clouds2.push({obj:g,life:12});if(!G.inVault&&heroDist(e)<25)toast("Eloise left a sneeze cloud! 🤧 Don’t touch it!",2000)}
  if(G.inVault||G.eCD>0)return;
  if(heroDist(e)<1.3&&hero.position.y<1.5){
    G.eCD=2;
    if(G.eHas>0){const back=G.eHas+1;G.carried+=back;G.eHas=0;G.eState="wander";G.eT=3;chime([1047,1319,1568],.06,.2);toast(`Eloise: Okay, okay! Here are your stars back 🙈 (+${back})`,2400)}
    else if(G.carried>0){G.carried--;G.eHas++;G.eState="flee";G.eT=4;chime([440,330],.1,.25,"triangle",.08);toast("Eloise: Hehe! I’m un-mixing your stars! 😈 Tag her to get it back!",2600)}
  }
}
function updateLora(dt,t){
  let sp=0;
  if(G.lPause<=0){
    if(!G.lTarget||!G.lTarget.active){let best=null,bd=1e9;stars.forEach(s=>{if(!s.active||s.high)return;const d=Math.hypot(s.m.position.x-lora.position.x,s.m.position.z-lora.position.z);if(d<bd){bd=d;best=s}});G.lTarget=best}
    if(G.lTarget){sp=4;const d=moveToward(lora,G.lTarget.m.position.x,G.lTarget.m.position.z,sp,dt);
      if(d<1.2){collect(G.lTarget);G.lTarget=null;G.loraCount++;G.lPause=2;
        const st=Math.floor(G.loraCount/5);loraTower.forEach((s,i)=>s.visible=i<st);
        if(G.loraCount%5===0&&G.loraCount<GOAL)toast("Lora: My tower is getting taller! 😤",2000);
        if(G.loraCount>=GOAL)lose()}}
  }
  animChar(lora,sp?1:0,t*1.1,dt);
}
function ambient(dt,t){
  practice.forEach((p,i)=>{const k=p.c,a=t*2.4+p.phase;p.orb.position.set(k.position.x+Math.cos(a)*1.1,1.9+Math.sin(a*1.5)*.4+k.position.y,k.position.z+Math.sin(a)*1.1);p.hop-=dt;if(p.hop<-3-i)p.hop=.6;k.position.y=p.hop>0?Math.sin(p.hop/.6*PI)*1.2:0;animChar(k,0,t,dt);k.userData.arms[1].rotation.z=-1.6+Math.sin(t*3+i)*.3});
  family.forEach((f,i)=>{if(f.userData.cheer>0){f.userData.cheer-=dt;f.position.y=Math.abs(Math.sin(f.userData.cheer*9))*.8;f.userData.arms.forEach(a=>a.rotation.z=a.userData.base*10)}else if(G.over&&G.delivered>=GOAL){f.position.y=Math.abs(Math.sin(t*7+i))*.9;f.userData.arms.forEach(a=>a.rotation.z=a.userData.base*10)}else{f.position.y=0;f.userData.arms.forEach(a=>a.rotation.z=a.userData.base)}animChar(f,0,t,dt);f.rotation.y=lerpAngle(f.rotation.y,Math.atan2(hero.position.x-f.position.x,hero.position.z-f.position.z),3*dt)});
  clouds.forEach((c,i)=>{c.rotation.y+=dt*.02;if(c.userData.y)c.position.y=c.userData.y+Math.sin(t*.6+i)*.8});
  door.children[0].material.opacity=.6+Math.sin(t*3)*.25;
  if(G.mode==="ctf"){ctf.ff.material.opacity=.18+Math.sin(t*4)*.07;ctf.ffBars.forEach((b,i)=>b.position.y=(t*2+i*3)%9);if(!G.playing)units.forEach(u=>{if(!u.isPlayer)animChar(u.c,0,t,dt)})}
  vault.portal.rotation.z+=dt;vault.wand.rotation.y+=dt*2;
  // twinkly music box
  if(G.playing&&ac&&soundOn){musicT-=dt;if(musicT<=0){musicT=.45+Math.random()*.3;tone(PENTA[Math.floor(Math.random()*PENTA.length)]*(mood===2?.5:1),ac.currentTime,.9,"sine",.03)}}
}

/* ---------- boot ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?68:58;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
baseCircles=colCircles.length;
const skipW=new Set([hero,buddy,ctfGroup,rainbow,skyStars,...stars.map(s=>s.m)]);
const starWorld=scene.children.filter(o=>!o.isLight&&!skipW.has(o));
G.mode="star";resetGame();setMood(0,true);snapCam();
requestAnimationFrame(frame);
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hide and Seek Online · The Hero’s Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1B3D; --muted:#6E5E8C; --pill:rgba(255,255,255,.88); --pill-ink:#2A1B3D;
  --pink:#FF5FA8; --pink-deep:#D63C86; --grape:#6B3FD1; --grape-deep:#4E2AA6; --sky:#5CC8FF; --sun:#FFC23C; --mint:#2BCB8B;
  --panel:#FFFFFF; --panel-ink:#2A1B3D;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--pill:rgba(37,26,66,.88);--pill-ink:#F4EEFF;--panel:#251A42;--panel-ink:#F4EEFF;--muted:#B7A8D9;color-scheme:dark}
}
:root[data-theme="dark"]{--pill:rgba(37,26,66,.88);--pill-ink:#F4EEFF;--panel:#251A42;--panel-ink:#F4EEFF;--muted:#B7A8D9;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#9ED8FF}
body{font:600 16px/1.4 "Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:6px 14px;font-weight:800;font-size:1.35rem;line-height:1.2;box-shadow:0 3px 0 rgba(42,27,61,.18);backdrop-filter:blur(8px)}
.bars{flex:1;max-width:340px;background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:6px 12px 8px;box-shadow:0 3px 0 rgba(42,27,61,.18);backdrop-filter:blur(8px)}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.85rem;font-weight:800}
.bar + .bar{margin-top:3px}
.bar .tr{height:10px;border-radius:10px;background:rgba(110,94,140,.25);overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:10px;background:var(--pink);transition:width .4s ease}
.bar.lora .tr i{background:#FF8A3D}
.bar.lora{opacity:.85;font-size:.78rem}
.hud-btns{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--pill);font-size:1.4rem;box-shadow:0 3px 0 rgba(42,27,61,.18)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%) translateY(-8px);background:var(--panel);color:var(--panel-ink);padding:10px 18px;border-radius:18px;font-weight:800;font-size:1.05rem;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 0 rgba(42,27,61,.15);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:6}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* touch controls */
#controls{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:auto auto;grid-template-areas:"wish dash" "jump jump";gap:12px;z-index:5;justify-items:end}
.act{border:0;border-radius:50%;width:72px;height:72px;display:grid;place-items:center;align-content:center;color:#fff;font-size:1.6rem;line-height:1;touch-action:none}
.act small{display:block;font-size:.8rem;margin-top:2px;font-weight:800}
#jumpBtn{grid-area:jump;width:92px;height:92px;font-size:2rem;background:var(--pink);box-shadow:0 6px 0 var(--pink-deep)}
#dashBtn{grid-area:dash;background:#3FA7E8;box-shadow:0 5px 0 #2577AE}
#wishBtn{grid-area:wish;background:var(--grape);box-shadow:0 5px 0 var(--grape-deep)}
.act:active,.act.down{transform:translateY(4px);box-shadow:none!important}
.act[aria-disabled="true"]{filter:grayscale(.7);opacity:.6}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.7);display:none;z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(42,27,61,.2)}
#joyHint{position:fixed;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:110px;height:110px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;font-size:.85rem;pointer-events:none;z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.35)}
@media (hover:hover) and (pointer:fine){#joyHint{display:none}}

#wishMenu{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:12px;display:grid;gap:8px;z-index:7;width:min(260px,80vw);box-shadow:0 8px 0 rgba(42,27,61,.15)}
#wishMenu[hidden]{display:none}
#wishMenu h3{margin:0 4px 2px;font-size:1.1rem}
#wishMenu button{border:0;border-radius:14px;padding:10px 12px;text-align:left;background:rgba(107,63,209,.12);font-weight:800;font-size:1rem}
#wishMenu button span{display:block;font-weight:600;font-size:.82rem;color:var(--muted)}

/* screens */
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(120% 90% at 50% 20%,rgba(255,214,236,.92),rgba(158,216,255,.94));overflow:auto}
.screen[hidden]{display:none}
.card{background:var(--panel);color:var(--panel-ink);border-radius:32px;padding:26px 24px;max-width:480px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(42,27,61,.12)}
.script{font-family:"Pacifico","Snell Roundhand","Brush Script MT",cursive;font-weight:400;color:var(--pink)}
.byline{font-size:1.5rem;display:inline-block;transform:rotate(-3deg);margin-bottom:2px}
.card h1{font:800 clamp(2.4rem,10vw,3.4rem)/1 "Baloo 2",system-ui,sans-serif;margin:4px 0 12px;color:var(--grape)}
.card p{margin:0 0 12px;font-weight:600;font-size:1.05rem}
.card ul{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:6px;text-align:left;font-weight:600}
.card li{background:rgba(107,63,209,.08);border-radius:14px;padding:8px 12px}
.big{border:0;border-radius:20px;padding:14px 28px;font:800 1.35rem/1 "Baloo 2",system-ui,sans-serif;background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-deep)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
.needs-js{font-size:.95rem;color:var(--muted)}
body.js .needs-js{display:none}
body:not(.js) .big{display:none}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:9}
#fade.on{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
#confetti span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:520px){#hud{flex-wrap:wrap}.bars{order:3;flex-basis:100%;max-width:none}.mode-star #toast{top:calc(env(safe-area-inset-top,0px) + 136px)}.pill{font-size:1.15rem;padding:6px 10px}.round{width:42px;height:42px;font-size:1.2rem}}
/* modes */
.mode-ctf .star-only{display:none!important}
.mode-star .ctf-only{display:none!important}
#ctfHud{flex:1;max-width:360px;text-align:center;font-size:1.15rem;padding:6px 12px}
#ctfHud .row{display:flex;justify-content:center;gap:14px}
#ctfStatus{font-size:.85rem;font-weight:700;opacity:.85}
#ctxBtn{grid-area:wish;background:#FF8A3D;box-shadow:0 5px 0 #C9601F}
#redTint{position:fixed;inset:0;background:rgba(255,50,80,.32);mix-blend-mode:multiply;opacity:0;transition:opacity .35s;pointer-events:none;z-index:2}
#redTint.on{opacity:1}
#count{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:800 9rem/1 "Baloo 2",system-ui,sans-serif;color:#fff;text-shadow:0 6px 0 var(--pink-deep),0 0 30px rgba(42,27,61,.35);pointer-events:none;z-index:7}
#count.pop{animation:pop .8s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1.8);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
#readyBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 270px);transform:translateX(-50%);z-index:6;white-space:nowrap}
#readyBtn[hidden]{display:none}
.modes{display:grid;gap:12px;margin:16px 0 8px}
.mode{border:0;border-radius:22px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:rgba(107,63,209,.1);color:var(--panel-ink)}
.mode .ic{grid-row:span 2;font-size:2.2rem}
.mode b{font-size:1.3rem;line-height:1.1;display:block}
.mode span:not(.ic){font-size:.92rem;font-weight:600;color:var(--muted);line-height:1.3;display:block}
.mode:first-child b{color:var(--pink)}.mode:last-child b{color:#3FA7E8}
body:not(.js) .mode{display:none}
.card .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.ghostbtn{border:0;background:none;font-weight:800;color:var(--muted);font-size:1.1rem;padding:12px}
/* hide and seek */
.mode-hs .star-only,.mode-hs .ctf-only,.mode-hs .no-hs{display:none!important}
body:not(.mode-hs) .hs-only{display:none!important}
#hsTop{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:6px 14px 8px;box-shadow:0 3px 0 rgba(42,27,61,.18);max-width:calc(100vw - 190px);backdrop-filter:blur(8px)}
#hsTimer{font:800 1.8rem/1.05 "Baloo 2",system-ui,sans-serif}
#hsTimer.hurry{color:#FF2D55;animation:hurry .5s infinite alternate}
@keyframes hurry{to{transform:scale(1.08)}}
#hsPhase{font-weight:800;font-size:.95rem;line-height:1.2}
#hsFound{font-size:.78rem;font-weight:700;opacity:.85;line-height:1.2}
#hsMeter{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 118px);z-index:5;background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:8px 14px;width:min(330px,92vw);text-align:center;font-weight:800;box-shadow:0 4px 0 rgba(42,27,61,.15)}
#hsMeter .hc{height:12px;border-radius:12px;background:rgba(110,94,140,.25);overflow:hidden;margin-top:6px}
#hsHC{display:block;height:100%;width:10%;border-radius:12px;transition:width .3s}
#hsCross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);z-index:4;pointer-events:none}
#hsAct{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:6;max-width:62vw;font-size:1.15rem;line-height:1.15}
#hsView{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:6;border:0;border-radius:18px;padding:12px 16px;background:var(--grape);color:#fff;font:800 1.05rem "Baloo 2",system-ui,sans-serif;box-shadow:0 5px 0 var(--grape-deep)}
#hsCount{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:800 2.4rem/1.1 "Baloo 2",system-ui,sans-serif;color:#fff;text-shadow:0 4px 0 var(--pink-deep),0 0 24px rgba(42,27,61,.5);z-index:5;pointer-events:none;text-align:center;width:90vw}
#hsRole{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);z-index:7;background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:12px 16px;text-align:center;box-shadow:0 6px 0 rgba(42,27,61,.15);width:min(340px,92vw);font-weight:800}
#hsRole .row2 button{font-size:1.05rem;padding:10px 16px}
#hsAct[hidden],#hsView[hidden],#hsMeter[hidden],#hsCount[hidden],#hsRole[hidden],#hsCross[hidden]{display:none!important}
.mode-hs #toast{top:calc(env(safe-area-inset-top,0px) + 112px)}
.mode:nth-child(3) b{color:#FF8A3D}

/* online hide and seek */
#hsTop{max-width:calc(100vw - 130px)}
#hsMe{font-size:.82rem;font-weight:800;border-radius:10px;padding:2px 8px;margin-top:3px;display:inline-block}
#hsMe.blue{background:#CDEFFF;color:#2A1B3D}#hsMe.red{background:#FFD3D3;color:#2A1B3D}
#hsNet{font-size:.72rem;opacity:.7;font-weight:700}
#hsViews{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;gap:6px;z-index:6;flex-wrap:wrap;justify-content:center;width:min(96vw,520px)}
#hsViews button{border:0;border-radius:14px;padding:10px 12px;background:var(--pill);font-weight:800;font-size:.95rem;color:var(--pill-ink);box-shadow:0 3px 0 rgba(42,27,61,.2)}
#hsViews button.on{background:var(--grape);color:#fff}
#hsZoom{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:6}
#hsZoom button{width:54px;height:54px;border-radius:50%;border:0;background:var(--pill);color:var(--pill-ink);font:800 1.7rem/1 "Baloo 2",system-ui,sans-serif;box-shadow:0 3px 0 rgba(42,27,61,.2)}
#hsJump,#hsLunge{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:86px;height:86px;border-radius:50%;border:0;color:#fff;font:800 1.05rem/1.1 "Baloo 2",system-ui,sans-serif;z-index:6;touch-action:none}
#hsJump{background:var(--pink);box-shadow:0 6px 0 var(--pink-deep)}
#hsLunge{background:#FF8A3D;box-shadow:0 6px 0 #C9601F}
#hsLunge[aria-disabled="true"]{filter:grayscale(.6);opacity:.7}
#hsAct{bottom:calc(env(safe-area-inset-bottom,0px) + 126px)!important}
#hsViews[hidden],#hsZoom[hidden],#hsJump[hidden],#hsLunge[hidden],#joyHint[hidden]{display:none!important}
.field{width:100%;border:2px solid #DCD0FA;background:#fff;color:#2A1B3D;border-radius:16px;padding:12px 14px;font:700 1.1rem "Baloo 2",system-ui,sans-serif;margin:6px 0 10px}
.field.code{letter-spacing:.25em;text-transform:uppercase;text-align:center;margin:0}
.joinrow{flex-wrap:nowrap!important;margin:10px 0}.joinrow .field{flex:1;min-width:0}
.status{color:var(--muted);font-weight:700;min-height:1.2em;margin-top:8px}
.code{color:var(--pink);letter-spacing:.12em}
.chargrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:8px 0}
@media (max-width:440px){.chargrid{grid-template-columns:1fr 1fr}}
.charbtn{border:0;border-radius:14px;padding:8px 6px;text-align:center;font-weight:800;line-height:1.15}
.charbtn.blue{background:#CDEFFF;color:#2A1B3D}.charbtn.red{background:#FFD3D3;color:#2A1B3D}
.charbtn span{display:block;font-size:.76rem;font-weight:700;opacity:.8}
.charbtn.mine{outline:3px solid var(--pink);outline-offset:1px}
.charbtn[disabled]{opacity:.5}
.seekpref{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:800;margin:8px 0}
.seekpref input{width:22px;height:22px}
.who{font-size:.9rem;color:var(--muted);margin:6px 0}
#screenCard .big{margin:4px 0}

.mode-hs #toast{top:calc(env(safe-area-inset-top,0px) + 150px)}
#hsMeter{top:auto!important;bottom:calc(env(safe-area-inset-bottom,0px) + 132px)}
#editor{position:fixed;left:0;right:0;bottom:0;max-height:58vh;overflow:auto;background:var(--panel);color:var(--panel-ink);border-radius:26px 26px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:12;box-shadow:0 -6px 24px rgba(42,27,61,.25)}
#editor[hidden],#hsTop[hidden]{display:none!important}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:1.15rem}
.ed-head span{font-size:.85rem;border-radius:10px;padding:2px 8px;margin-left:4px}.ed-head span.blue{background:#CDEFFF}.ed-head span.red{background:#FFD3D3}
.ed-x{border:0;background:rgba(107,63,209,.12);width:40px;height:40px;border-radius:50%;font-size:1.1rem;font-weight:800}
.ed-l{display:block;font-weight:800;margin:10px 0 4px}
.ed-chips{display:flex;flex-wrap:wrap;gap:6px}
.ed-chips button{border:2px solid #DCD0FA;background:#fff;color:#2A1B3D;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.9rem}
.ed-chips button.on{background:var(--grape);border-color:var(--grape);color:#fff}
.ed-sw{display:flex;flex-wrap:wrap;gap:8px}
.ed-sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #DCD0FA}
.ed-sw button.on{box-shadow:0 0 0 3px var(--grape)}
.ed-note{font-size:.85rem;color:var(--muted);margin:10px 0 4px}
</style>
</head>
<body class="mode-hs">
<canvas id="game"></canvas>
<div id="hud"><div class="hud-btns"><button class="round" id="leaveTop" aria-label="Leave game">🏠</button><button class="round" id="soundBtn" aria-label="Sound on or off">🔊</button></div></div>
<div id="hsTop" class="hs-only"><div id="hsTimer">⏱ 0:45</div><div id="hsPhase"></div><div id="hsMe"></div><div id="hsFound"></div><div id="hsNet"></div></div>
<div id="toast" role="status"></div>
<div id="joyHint" hidden>Drag here<br>to move</div>
<div id="joy"><div id="knob"></div></div>
<div id="hsMeter" class="hs-only" hidden><div id="hsFeet"></div><div class="hc"><i id="hsHC"></i></div></div>
<div id="hsCross" class="hs-only" hidden></div>
<div id="hsCount" class="hs-only" hidden></div>
<button class="big hs-only" id="hsAct" hidden></button>
<button id="hsJump" hidden>⬆️<br>Jump</button>
<button id="hsLunge" hidden>⚡ Lunge</button>
<div id="hsViews" hidden></div>
<div id="hsZoom" hidden><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button></div>
<div id="hsRole" class="hs-only" hidden>Next round I want to be:<div class="row2" style="margin-top:8px"><button class="big" data-hsnext="hider">🙈 Hider</button><button class="big" data-hsnext="seeker" style="background:#3FA7E8;box-shadow:0 6px 0 #2577AE">🔍 Seeker</button></div></div>
<div class="screen" id="screen"><div class="card" id="screenCard"><span class="script byline">by Lola 🩵</span><h1>Hide and Seek</h1><p class="needs-js">To play, open this game from a web link in Chrome or Safari.</p></div></div>
<div id="editor" hidden></div>
<div id="fade"></div>
<div id="confetti"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
document.body.classList.add("js");
const G={playing:false,fpYaw:0,fpPitch:0};
let nowT=0;
const $=s=>document.querySelector(s);
const GOAL=25,PI=Math.PI;

/* ---------- renderer & scene ---------- */
const canvas=$("#game");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){$("#screenCard").innerHTML="<h1>Oops!</h1><p>This game needs 3D graphics, which this browser can’t show. Try Chrome or Safari.</p>";return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(58,1,.1,400);
scene.fog=new THREE.Fog(0x9ED8FF,70,170);
scene.background=new THREE.Color(0x9ED8FF);
const hemi=new THREE.HemisphereLight(0xffffff,0x7fcf6a,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(30,50,20);scene.add(sun);

const PREFIX="herosdream-hs-";

  const chars=HS_ROSTER.map((r,i)=>{const owner=L.players.find(p=>p.idx===i);const me=owner&&owner.id===NET.myId;return `<button class="charbtn ${r.team}${me?" mine":""}" data-pick="${i}" ${owner&&!me?"disabled":""}><b>${r.name}</b><span>${me?"⭐ You":owner?esc(owner.name):"🤖 Computer"}</span></button>`}).join("");
  const head=NET.mode==="solo"?`<h1>Play solo</h1><p>Pick your character. The computer plays everyone else.</p>`:`<h1>Code: <span class="code">${L.code}</span></h1><p>Friends tap “Join a game” and type this code.</p><div class="row2"><button class="ghostbtn" id="inviteBtn">📤 Share invite link</button></div>`;
  showScreen(`<span class="script byline">Hide and Seek Online</span>${head}<p><b>Pick your character</b> (🔵 blue team on top, 🔴 red team below):</p><div class="chargrid">${chars}</div>${mine.idx>=0?`<div class="row2"><button class="big" id="editBtn" style="background:#8E6CFF;box-shadow:0 6px 0 #6B3FD1">✏️ Edit my avatar</button></div>`:""}<label class="seekpref"><input type="checkbox" id="seekPref" ${mine.seek?"checked":""}> I want to be the seeker</label>${NET.mode!=="solo"?`<p class="who">${L.players.length} ${L.players.length===1?"player":"players"} here: ${L.players.map(p=>esc(p.name)).join(", ")}</p>`:""}${host?`<button class="big" id="startBtn">▶️ Start the game</button><p class="who">Empty spots are played by the computer.</p>`:`<p><b>Waiting for the host to start…</b></p>`}<div class="row2"><button class="ghostbtn" id="leaveBtn">Leave</button></div>`);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showMenu(){
  let nm="";try{nm=localStorage.getItem("hsName")||""}catch(e){}
  const q=new URLSearchParams(location.search).get("join")||"";
  const online=!!window.Peer;
  showScreen(`<span class="script byline">by Lola 🩵</span><h1>Hide and Seek</h1><p>Play online with family and friends, 4 🔵 blue vs 4 🔴 red!</p><input class="field" id="nameIn" maxlength="10" placeholder="Your name" value="${esc(nm)}"><button class="big" id="hostBtn">🏠 Create a game</button><div class="row2 joinrow"><input class="field code" id="codeIn" maxlength="4" placeholder="CODE" value="${esc(q.toUpperCase())}" autocapitalize="characters"><button class="big" id="joinBtn" style="background:#3FA7E8;box-shadow:0 6px 0 #2577AE">🔑 Join</button></div><button class="ghostbtn" id="soloBtn">🎮 Play solo with computer players</button><p class="status" id="netStatus">${online?"":"Online play isn’t available here. Open the game from your GitHub link to play with others."}</p>`);
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#hostBtn")){audioOn();hostGame();return}
  if(t.closest("#joinBtn")){audioOn();joinGame();return}
  if(t.closest("#soloBtn")){audioOn();playSolo();return}
  if(t.closest("#leaveBtn")){leave();return}
  const pk=t.closest("[data-pick]");if(pk){const i=+pk.dataset.pick;sendHost({t:"pick",idx:i,look:loadLook(i)});if(isHost())renderLobby();return}
  if(t.closest("#startBtn")){audioOn();HS.wins={blue:0,red:0};hostStartRound();return}
  if(t.closest("#nextRound")){audioOn();hostStartRound();return}
  if(t.closest("#toLobby")){if(NET.mode==="host"){broadcast({t:"tolobby"});HS.phase="lobby";G.playing=false;renderLobby()}else leave();return}
  const pf=t.closest("[data-pref]");if(pf){const seek=pf.dataset.pref==="seeker";sendHost({t:"pref",seek});const st=$("#prefStatus");if(st)st.textContent=seek?"🔍 You asked to be the seeker.":"🙈 You’ll hide next round.";return}
  const hn=t.closest("[data-hsnext]");if(hn){sendHost({t:"pref",seek:hn.dataset.hsnext==="seeker"});$("#hsRole").hidden=true;toast("Got it! Watching the seeker now… 👀",2400);return}
  if(t.closest("#inviteBtn")){const url=location.origin+location.pathname+"?join="+NET.code;if(navigator.share)navigator.share({title:"Hide and Seek",text:`Come play Hide and Seek with me! Code: ${NET.code}`,url}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(url).then(()=>toast("Invite link copied! 📋")).catch(()=>toast(url,5000))}return}
  if(t.closest("#hsAct")||t.closest("#hsView")){hsAction();return}
});
document.addEventListener("change",e=>{if(e.target.id==="seekPref")sendHost({t:"pref",seek:e.target.checked})});
$("#leaveTop").addEventListener("click",()=>leave());

/* ---------- avatar editor ---------- */
const ED={look:null,mesh:null,idx:0};
const ED_SKIN=["#F6D5BE","#E8B48C","#E8934F","#C68642","#8D5524","#5A3825","#FFB36B","#9EE6A8","#B9A6FF","#7FD3FF"];
const ED_HAIRC=["#2B1B12","#6B3E1F","#C58B3A","#F4D06F","#DADAE6","#FF6FB5","#8E6CFF","#33C3F0","#FF7A3D"];
const ED_BONNET=["#C2185B","#8E6CFF","#33C3F0","#FFC23C","#2BCB8B"];
const ED_OPTS=[["hair","Hair",[["none","None"],["curly","Curly"],["bob","Bob"],["long","Long"],["pigtails","Pigtails"],["bun","Bun"]]],["eyes","Eyes",[["round","Round"],["sparkle","Sparkly"],["happy","Happy"]]],["glasses","Glasses",[["","None"],["round","Round"],["club","Clubmaster"]]],["outfit","Outfit",[["hoodie","Hoodie"],["tee","T-shirt"],["dress","Dress"]]],["scale","Size",[["0.85","Small"],["1","Medium"],["1.15","Tall"]]]];
const looksEq=(a,b)=>JSON.stringify(a||null)===JSON.stringify(b||null);
function baseLook(i){return JSON.parse(JSON.stringify(HS_ROSTER[i].look))}
function loadLook(i){try{const s=localStorage.getItem("hsLook"+i);if(s)return JSON.parse(s)}catch(e){}return null}
function saveLook(i,l){try{localStorage.setItem("hsLook"+i,JSON.stringify(l))}catch(e){}}
function cleanLook(l){const o={};["skin","hair","hairColor","eyes","glasses","outfit","bonnet","pants"].forEach(k=>{if(typeof l[k]==="string"&&l[k].length<12)o[k]=l[k]});if(l.belly)o.belly=true;const sc=+l.scale;o.scale=sc>=.8&&sc<=1.2?sc:1;if(!o.skin)o.skin="#E8B48C";if(!o.hair)o.hair="none";if(!o.hairColor)o.hairColor="#2B1B12";if(!o.eyes)o.eyes="round";return o}
function applyLook(ch,look){
  look=cleanLook(look||baseLook(ch.idx));if(looksEq(ch.look,look))return;
  const old=ch.c,c=makeChar(Object.assign({outfit:"hoodie"},look,{outfitColor:TEAM[ch.team].color}));
  c.position.copy(old.position);c.rotation.copy(old.rotation);c.visible=old.visible;hsGroup.remove(old);hsAdd(c);
  const belt=M(new THREE.BoxGeometry(.09,1.05,.06),toon("#3A3550"),0,1.2,look.belly?.8:.42);belt.rotation.z=.75;belt.visible=false;c.userData.body.add(belt);c.userData.belt=belt;
  ch.c=c;ch.look=look;ch.lbl=null;setLabel(ch);
}
function openEditor(){
  const L=NET.mode==="client"?NET.lobby:{players:NET.players};const me=L&&L.players.find(p=>p.id===NET.myId);if(!me||me.idx<0)return;
  ED.idx=me.idx;ED.look=cleanLook(me.look||loadLook(me.idx)||baseLook(me.idx));ED.name=me.name;
  HS.editing=true;$("#screen").hidden=true;$("#editor").hidden=false;renderEditor();buildPreview();
}
function buildPreview(){if(ED.mesh)hsGroup.remove(ED.mesh);const ry=ED.mesh?ED.mesh.rotation.y:0;ED.mesh=makeChar(Object.assign({outfit:"hoodie"},ED.look,{outfitColor:TEAM[HS_ROSTER[ED.idx].team].color}));ED.mesh.position.set(0,0,24);ED.mesh.rotation.y=ry;hsAdd(ED.mesh)}
function closeEditor(){HS.editing=false;$("#editor").hidden=true;if(ED.mesh){hsGroup.remove(ED.mesh);ED.mesh=null}renderLobby()}
function renderEditor(){
  const l=ED.look,team=HS_ROSTER[ED.idx].team;
  const sw=(key,cols)=>`<div class="ed-sw">${cols.map(c=>`<button data-ed="${key}" data-v="${c}" style="background:${c}" class="${l[key]===c?"on":""}" aria-label="${c}"></button>`).join("")}</div>`;
  const chips=(key,opts)=>`<div class="ed-chips">${opts.map(o=>`<button data-ed="${key}" data-v="${o[0]}" class="${String(l[key]===undefined?"":l[key])===o[0]||(key==="scale"&&+o[0]===+l.scale)?"on":""}">${o[1]}</button>`).join("")}</div>`;
  $("#editor").innerHTML=`<div class="ed-head"><b>✏️ Design ${HS_ROSTER[ED.idx].name} <span class="${team}">${team==="blue"?"🔵 Blue":"🔴 Red"} team</span></b><button class="ed-x" id="edClose" aria-label="Close">✕</button></div>
  <label class="ed-l">Your name<input class="field" id="edName" maxlength="10" value="${esc(ED.name||"")}"></label>
  <div class="ed-l">Skin</div>${sw("skin",ED_SKIN)}
  ${ED_OPTS.map(o=>`<div class="ed-l">${o[1]}</div>${chips(o[0],o[2])}`).join("")}
  <div class="ed-l">Hair color</div>${sw("hairColor",ED_HAIRC)}
  <div class="ed-l">Extras</div><div class="ed-chips"><button data-ed="belly" data-v="toggle" class="${l.belly?"on":""}">🫃 Big belly</button><button data-ed="bonnet" data-v="" class="${l.bonnet?"":"on"}">No bonnet</button></div>${sw("bonnet",ED_BONNET)}
  <p class="ed-note">Your outfit is always your team color. Saved on this phone.</p>
  <div class="row2"><button class="big" id="edSave">✅ Save my avatar</button><button class="ghostbtn" id="edReset">Reset</button></div>`;
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#editBtn")){openEditor();return}
  if(t.closest("#edClose")){closeEditor();return}
  if(t.closest("#edReset")){ED.look=cleanLook(baseLook(ED.idx));renderEditor();buildPreview();return}
  if(t.closest("#edSave")){const nm=($("#edName").value||"").trim().slice(0,10);if(nm){ED.name=nm;try{localStorage.setItem("hsName",nm)}catch(e){}}saveLook(ED.idx,ED.look);sendHost({t:"look",idx:ED.idx,look:ED.look,name:ED.name});toast("✅ Avatar saved!",1800);closeEditor();return}
  const b=t.closest("[data-ed]");if(b){const k=b.dataset.ed,v=b.dataset.v;
    if(k==="belly")ED.look.belly=!ED.look.belly;else if(k==="scale")ED.look.scale=+v;else if(k==="glasses"||k==="bonnet"){if(v)ED.look[k]=v;else delete ED.look[k]}else ED.look[k]=v;
    renderEditor();buildPreview()}
});

/* ---------- house layers & seeker marker ---------- */
hsGroup.updateMatrixWorld(true);
HS.roofObjs=[];HS.upperObjs=[];
(function(){const b=new THREE.Box3();hsGroup.children.slice().forEach(o=>{if(o===HS.van||o===HS.glow||HS.chars.some(c=>c.c===o))return;b.setFromObject(o);if(b.min.y>=7.9)HS.roofObjs.push(o);else if(b.min.y>=3.6)HS.upperObjs.push(o)})})();
HS.marker=new THREE.Group();
(function(){const mc=M(new THREE.ConeGeometry(.7,1.4,16),new THREE.MeshBasicMaterial({color:"#FF2D55",depthTest:false,transparent:true}));mc.rotation.x=PI;mc.renderOrder=999;HS.marker.add(mc);const ml=label("🔍 Seeker","#FFD3D3");ml.material.depthTest=false;ml.renderOrder=999;ml.position.y=1.5;ml.scale.set(3,.75,1);HS.marker.add(ml)})();
HS.marker.visible=false;hsAdd(HS.marker);
hsGroup.visible=true;HS.chars.forEach(ch=>ch.c.visible=false);HS.van.position.z=40;HS.phase="menu";

/* ---------- helpers ---------- */
function lerpAngle(a,b,t){const d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI;return a+d*Math.min(1,t)}
let toastT=0;
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.classList.add("on");toastT=(ms||2400)/1000}
function confetti(n){const box=$("#confetti"),em=["⭐","🩵","✨","💖","🌈","💎"];for(let i=0;i<n;i++){const s=document.createElement("span");s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(2+Math.random()*2)+"s";s.style.animationDelay=Math.random()*1.2+"s";box.appendChild(s);setTimeout(()=>s.remove(),5000)}}
function showScreen(html){$("#screenCard").innerHTML=html;$("#screen").hidden=false}
let ac=null,soundOn=true;
function audioOn(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume()}
function tone(f,t0,dur,type,vol){if(!ac||!soundOn)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.12,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+dur+.05)}
function chime(fs,gap,dur,type,vol){if(!ac)return;const t=ac.currentTime;fs.forEach((f,i)=>tone(f,t+i*(gap||.07),dur||.25,type,vol))}
$("#soundBtn").onclick=()=>{soundOn=!soundOn;$("#soundBtn").textContent=soundOn?"🔊":"🔇"};

/* ---------- input ---------- */
const keys={};
const joy={id:null,ox:0,oy:0,x:0,y:0};
addEventListener("keydown",e=>{if(e.target&&e.target.tagName==="INPUT")return;const k=e.key.toLowerCase();keys[k]=true;
  if(k===" "||k.startsWith("arrow"))e.preventDefault();
  if(k===" "&&!e.repeat)hsJump();if(k==="shift")hsLunge();if(k==="e")hsAction()});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
let camDrag=null;const touches=new Map();let pinchD=0;
canvas.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="mouse")touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){camDrag=null;const [a,b]=[...touches.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);return}
  if(HS.pmode==="fp"&&e.pointerType!=="mouse"&&e.clientX<innerWidth*.5&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;const j=$("#joy");j.style.left=e.clientX+"px";j.style.top=e.clientY+"px";j.style.display="block";$("#knob").style.transform="";canvas.setPointerCapture(e.pointerId);return}
  camDrag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2&&e.pointerId!==joy.id){const [a,b]=[...touches.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchD>0){HS.dh.dist=Math.max(8,Math.min(70,HS.dh.dist*pinchD/d))}pinchD=d;return}
  if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),max=55;if(d>max){dx*=max/d;dy*=max/d}joy.x=dx/max;joy.y=dy/max;$("#knob").style.transform=`translate(${dx}px,${dy}px)`;return}
  if(camDrag&&e.pointerId===camDrag.id){G.fpYaw-=(e.clientX-camDrag.x)*.006;G.fpPitch=Math.max(-1.2,Math.min(1.1,G.fpPitch-(e.clientY-camDrag.y)*.005));camDrag.x=e.clientX;camDrag.y=e.clientY}
});
function endPtr(e){touches.delete(e.pointerId);if(touches.size<2)pinchD=0;if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;$("#joy").style.display="none"}if(camDrag&&e.pointerId===camDrag.id)camDrag=null}
canvas.addEventListener("pointerup",endPtr);canvas.addEventListener("pointercancel",endPtr);
canvas.addEventListener("wheel",e=>{e.preventDefault();HS.dh.dist=Math.max(8,Math.min(70,HS.dh.dist*(e.deltaY>0?1.1:.9)))},{passive:false});
$("#hsJump").addEventListener("pointerdown",e=>{e.preventDefault();hsJump()});
$("#hsLunge").addEventListener("pointerdown",e=>{e.preventDefault();hsLunge()});
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;nowT=t;
  if(G.playing){if(isHost())hostUpdate(dt,t);else clientUpdate(dt,t);localUpdate(dt,t)}
  $("#joyHint").hidden=HS.pmode!=="fp"||!G.playing;$("#hsTop").hidden=!G.playing;
  hsCamera(dt);
  if(toastT>0){toastT-=dt;if(toastT<=0)$("#toast").classList.remove("on")}
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?70:60;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
showMenu();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>

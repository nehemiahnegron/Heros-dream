<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Capture the Flag Online · The Hero’s Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1B3D; --muted:#6E5E8C; --pill:rgba(255,255,255,.88); --pill-ink:#2A1B3D;
  --pink:#FF5FA8; --pink-deep:#D63C86; --grape:#6B3FD1; --grape-deep:#4E2AA6; --sky:#5CC8FF; --sun:#FFC23C; --mint:#2BCB8B;
  --panel:#FFFFFF; --panel-ink:#2A1B3D;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--pill:rgba(37,26,66,.88);--pill-ink:#F4EEFF;--panel:#251A42;--panel-ink:#F4EEFF;--muted:#B7A8D9;color-scheme:dark}
}
:root[data-theme="dark"]{--pill:rgba(37,26,66,.88);--pill-ink:#F4EEFF;--panel:#251A42;--panel-ink:#F4EEFF;--muted:#B7A8D9;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#9ED8FF}
body{font:600 16px/1.4 "Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:6px 14px;font-weight:800;font-size:1.35rem;line-height:1.2;box-shadow:0 3px 0 rgba(42,27,61,.18);backdrop-filter:blur(8px)}
.hud-btns{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--pill);font-size:1.4rem;box-shadow:0 3px 0 rgba(42,27,61,.18)}
#ctfHud{flex:1;max-width:380px;text-align:center;font-size:1.15rem;padding:6px 12px}
#ctfHud[hidden]{display:none}
#ctfHud .row{display:flex;justify-content:center;gap:14px}
#ctfStatus{font-size:.85rem;font-weight:700;opacity:.9}
#ctfMe{font-size:.72rem;font-weight:700;opacity:.7}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 108px);transform:translateX(-50%) translateY(-8px);background:var(--panel);color:var(--panel-ink);padding:10px 18px;border-radius:18px;font-weight:800;font-size:1.05rem;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 0 rgba(42,27,61,.15);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:6}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#controls{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:auto auto;grid-template-areas:"help sprint" "jump jump";gap:12px;z-index:5;justify-items:end}
#controls[hidden]{display:none}
.act{position:relative;border:0;border-radius:50%;width:72px;height:72px;display:grid;place-items:center;align-content:center;color:#fff;font-size:1.6rem;line-height:1;touch-action:none}
.act small{display:block;font-size:.8rem;margin-top:2px;font-weight:800}
#jumpBtn{grid-area:jump;width:92px;height:92px;font-size:2rem;background:var(--pink);box-shadow:0 6px 0 var(--pink-deep)}
#sprintBtn{grid-area:sprint;background:#3FA7E8;box-shadow:0 5px 0 #2577AE}
#sprintBtn::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(42,27,61,.6) calc(var(--cd,0) * 1turn),transparent 0);pointer-events:none}
#sprintBtn.go{background:#2BCB8B;box-shadow:0 5px 0 #1E9466}
#helpBtn{grid-area:help;background:#FF8A3D;box-shadow:0 5px 0 #C9601F}
.act:active,.act.down{transform:translateY(4px);box-shadow:none!important}
.act[aria-disabled="true"]{filter:grayscale(.7);opacity:.6}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.7);display:none;z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(42,27,61,.2)}
#joyHint{position:fixed;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:110px;height:110px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;font-size:.85rem;pointer-events:none;z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#kbHint{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--pill);color:var(--pill-ink);border-radius:14px;padding:6px 12px;font-size:.85rem;font-weight:800;z-index:3;pointer-events:none;max-width:60vw}
#joyHint[hidden],#kbHint[hidden]{display:none!important}
@media (hover:hover) and (pointer:fine){#joyHint{display:none!important}}
@media not all and (hover:hover) and (pointer:fine){#kbHint{display:none!important}}

#redTint{position:fixed;inset:0;background:rgba(255,50,80,.32);mix-blend-mode:multiply;opacity:0;transition:opacity .35s;pointer-events:none;z-index:2}
#redTint.on{opacity:1}
#count{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:800 9rem/1 "Baloo 2",system-ui,sans-serif;color:#fff;text-shadow:0 6px 0 var(--pink-deep),0 0 30px rgba(42,27,61,.35);pointer-events:none;z-index:7}
#count.pop{animation:pop .8s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1.8);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}

.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(120% 90% at 50% 20%,rgba(255,214,236,.92),rgba(158,216,255,.94));overflow:auto}
.screen[hidden]{display:none}
.card{background:var(--panel);color:var(--panel-ink);border-radius:32px;padding:26px 24px;max-width:480px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(42,27,61,.12)}
.script{font-family:"Pacifico","Snell Roundhand","Brush Script MT",cursive;font-weight:400;color:var(--pink)}
.byline{font-size:1.5rem;display:inline-block;transform:rotate(-3deg);margin-bottom:2px}
.card h1{font:800 clamp(2.2rem,9vw,3.2rem)/1 "Baloo 2",system-ui,sans-serif;margin:4px 0 12px;color:var(--grape)}
.card h2{font:800 1.15rem/1.2 "Baloo 2",system-ui,sans-serif;margin:12px 0 4px}
.card p{margin:0 0 12px;font-weight:600;font-size:1.05rem}
.card ul{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:6px;text-align:left;font-weight:600;font-size:.95rem}
.card li{background:rgba(107,63,209,.08);border-radius:14px;padding:8px 12px}
.big{border:0;border-radius:20px;padding:14px 28px;font:800 1.35rem/1 "Baloo 2",system-ui,sans-serif;background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-deep)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
.needs-js{font-size:.95rem;color:var(--muted)}
body.js .needs-js{display:none}
.card .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.ghostbtn{border:0;background:none;font-weight:800;color:var(--muted);font-size:1.1rem;padding:12px}
.field{width:100%;border:2px solid #DCD0FA;background:#fff;color:#2A1B3D;border-radius:16px;padding:12px 14px;font:700 1.1rem "Baloo 2",system-ui,sans-serif;margin:6px 0 10px}
.field.code{letter-spacing:.3em;text-align:center;margin:0}
.joinrow{flex-wrap:nowrap!important;margin:10px 0}.joinrow .field{flex:1;min-width:0}
.status{color:var(--muted);font-weight:700;min-height:1.2em;margin-top:8px}
.code{color:var(--pink);letter-spacing:.12em}
.chargrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:6px 0 10px}
@media (max-width:440px){.chargrid{grid-template-columns:1fr 1fr 1fr}}
.charbtn{border:0;border-radius:14px;padding:8px 6px;text-align:center;font-weight:800;line-height:1.15}
.charbtn.blue{background:#CDEFFF;color:#2A1B3D}.charbtn.red{background:#FFD3D3;color:#2A1B3D}
.charbtn span{display:block;font-size:.76rem;font-weight:700;opacity:.8}
.charbtn.mine{outline:3px solid var(--pink);outline-offset:1px}
.charbtn[disabled]{opacity:.5}
.who{font-size:.9rem;color:var(--muted);margin:6px 0}
#screenCard .big{margin:4px 0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
#confetti span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

#editor{position:fixed;left:0;right:0;bottom:0;max-height:58vh;overflow:auto;background:var(--panel);color:var(--panel-ink);border-radius:26px 26px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:12;box-shadow:0 -6px 24px rgba(42,27,61,.25)}
#editor[hidden]{display:none!important}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:1.15rem}
.ed-head span{font-size:.85rem;border-radius:10px;padding:2px 8px;margin-left:4px;color:#2A1B3D}.ed-head span.blue{background:#CDEFFF}.ed-head span.red{background:#FFD3D3}
.ed-x{border:0;background:rgba(107,63,209,.12);width:40px;height:40px;border-radius:50%;font-size:1.1rem;font-weight:800}
.ed-l{display:block;font-weight:800;margin:10px 0 4px}
.ed-chips{display:flex;flex-wrap:wrap;gap:6px}
.ed-chips button{border:2px solid #DCD0FA;background:#fff;color:#2A1B3D;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.9rem}
.ed-chips button.on{background:var(--grape);border-color:var(--grape);color:#fff}
.ed-sw{display:flex;flex-wrap:wrap;gap:8px}
.ed-sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #DCD0FA}
.ed-sw button.on{box-shadow:0 0 0 3px var(--grape)}
.ed-note{font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.mapbtn{border:2px solid #DCD0FA;background:#fff;color:#2A1B3D;border-radius:18px;padding:10px 8px;text-align:center;line-height:1.15;position:relative}
.mapbtn .me{display:block;font-size:1.8rem}
.mapbtn b{display:block;font-size:1rem}
.mapbtn span:not(.me){display:block;font-size:.74rem;font-weight:600;color:#6E5E8C;margin-top:2px}
.mapbtn i{display:block;font-style:normal;font-weight:800;font-size:.85rem;margin-top:4px;min-height:1.1em;color:#6B3FD1}
.mapbtn.on{border-color:var(--grape);box-shadow:0 0 0 2px var(--grape);background:#F1ECFF}
.gtype{justify-content:center;margin-bottom:6px}
.cornerLeave{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);border:0;border-radius:16px;padding:10px 16px;background:var(--panel);color:var(--muted);font:800 1rem "Baloo 2",system-ui,sans-serif;box-shadow:0 4px 0 rgba(42,27,61,.18);z-index:11}
@media (max-width:520px){.pill{font-size:1.1rem;padding:6px 10px}.round{width:42px;height:42px;font-size:1.2rem}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="redTint"></div>
<div id="hud"><div class="pill" id="ctfHud" hidden><div class="row"><span id="ctfScore">🔵 0 – 0 🔴</span><span id="ctfTime">⏱ 4:00</span></div><div id="ctfStatus"></div><div id="ctfMe"></div></div><div class="hud-btns"><button class="round" id="leaveTop" aria-label="Leave game">🏠</button><button class="round" id="soundBtn" aria-label="Sound on or off">🔊</button></div></div>
<div id="toast" role="status"></div>
<div id="count"></div>
<div id="joyHint" hidden>Drag here<br>to move</div>
<div id="kbHint" hidden>WASD or arrows to move · Space jump · Shift sprint · E help · drag to look</div>
<div id="joy"><div id="knob"></div></div>
<div id="controls" hidden>
  <button class="act" id="helpBtn" aria-label="Call your team for help">📣<small>Help</small></button>
  <button class="act" id="sprintBtn" aria-label="Sprint">💨<small>Sprint</small></button>
  <button class="act" id="jumpBtn" aria-label="Jump">⬆️<small>Jump</small></button>
</div>
<div class="screen" id="screen"><div class="card" id="screenCard"><span class="script byline">by Lola 🩵</span><h1>Capture the Flag</h1><p class="needs-js">To play, open this game from a web link in Chrome or Safari.</p></div></div>
<div id="editor" hidden></div>
<div id="confetti"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
document.body.classList.add("js");
const PI=Math.PI;
const $=s=>document.querySelector(s);
const G={playing:false,camYaw:0,manualT:0,heroYaw:PI,vy:0,grounded:true,jumps:0,superT:0,sprintT:0,sprintCD:0,lastKind:null,edit:false};
let nowT=0;

/* ---------- renderer & scene ---------- */
const canvas=$("#game");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){$("#screenCard").innerHTML="<h1>Oops!</h1><p>This game needs 3D graphics, which this browser can’t show. Try Chrome or Safari.</p>";return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(58,1,.1,400);
scene.fog=new THREE.Fog(0x9ED8FF,70,170);
scene.background=new THREE.Color(0x9ED8FF);
const hemi=new THREE.HemisphereLight(0xffffff,0x7fcf6a,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(30,50,20);scene.add(sun);
const grad=new THREE.DataTexture(new Uint8Array([100,180,240]),3,1,THREE.LuminanceFormat);grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.generateMipmaps=false;grad.needsUpdate=true;

const toon=c=>new THREE.MeshToonMaterial({color:new THREE.Color(c),gradientMap:grad});
const basic=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:new THREE.Color(c)},o||{}));
const shade=(c,l)=>{const x=new THREE.Color(c);x.offsetHSL(0,0,l);return x};
function M(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o}
const cyl=(a,b,h,s,o,ts,tl)=>new THREE.CylinderGeometry(a,b,h,s||16,1,o,ts,tl);
const sph=(r,w,h,a,b,c,d)=>new THREE.SphereGeometry(r,w||16,h||12,a,b,c,d);
function starShape(o,i){const s=new THREE.Shape();for(let k=0;k<10;k++){const r=k%2?i:o,a=PI/2+k*PI/5;k?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r)}s.closePath();return s}
function label(text,bg){
  const c=document.createElement("canvas");c.width=512;c.height=128;const x=c.getContext("2d");
  x.font="800 64px 'Baloo 2', system-ui, sans-serif";const w=Math.min(500,x.measureText(text).width+60);
  x.fillStyle=bg||"#FFFFFF";x.beginPath();const l=(512-w)/2;x.moveTo(l+40,14);x.arcTo(l+w,14,l+w,114,40);x.arcTo(l+w,114,l,114,40);x.arcTo(l,114,l,14,40);x.arcTo(l,14,l+w,14,40);x.fill();
  x.fillStyle="#2A1B3D";x.textAlign="center";x.textBaseline="middle";x.fillText(text,256,68);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthWrite:false}));s.scale.set(4,1,1);return s;
}

/* ---------- characters ---------- */
function makeChar(o){
  const g=new THREE.Group();
  const skin=toon(o.skin),cloth=toon(o.outfitColor),pants=toon(o.pants||shade(o.outfitColor,-.22)),dark=toon("#2A1B3D"),pink=toon("#FF8FC4"),hairM=toon(o.hairColor);hairM.side=THREE.DoubleSide;
  const legs=[];
  [-1,1].forEach(s=>{const p=new THREE.Group();p.position.set(s*.18,.75,0);p.add(M(cyl(.14,.13,.62,12),o.outfit==="dress"?skin:pants,0,-.33,0));const sh=M(sph(.17,12,10),dark,0,-.66,.06);sh.scale.set(1,.6,1.35);p.add(sh);g.add(p);legs.push(p)});
  if(o.outfit==="dress")g.add(M(cyl(.32,.74,1.0,20),cloth,0,1.0,0));else g.add(M(cyl(.36,.42,.8,20),cloth,0,1.1,0));
  const shd=M(sph(.37,20,12),cloth,0,1.47,0);shd.scale.set(1.05,.45,.85);g.add(shd);
  if(o.outfit==="hoodie"){const hood=M(new THREE.TorusGeometry(.25,.09,8,20),cloth,0,1.55,-.2);hood.rotation.x=PI/2.3;g.add(hood);if(!o.belly)g.add(M(new THREE.BoxGeometry(.42,.18,.06),toon(shade(o.outfitColor,-.1)),0,.92,.4))}
  if(o.belly){const b=M(sph(.54,20,14),cloth,0,1.02,.26);b.scale.set(1,.95,.9);g.add(b);if(o.shirtDot){const d=M(sph(.2,12,8),basic(o.shirtDot),0,1.12,.73);d.scale.set(1,1,.25);g.add(d)}}
  const arms=[];
  [-1,1].forEach(s=>{const p=new THREE.Group();p.position.set(s*.44,1.44,0);p.rotation.z=s*.18;p.userData.base=s*.18;p.add(M(cyl(.1,.09,.62,12),o.outfit==="dress"?skin:cloth,0,-.31,0));p.add(M(sph(.12,12,10),skin,0,-.66,0));g.add(p);arms.push(p)});
  g.add(M(cyl(.12,.12,.2,10),skin,0,1.6,0));
  const head=new THREE.Group();head.position.y=2.04;g.add(head);
  const hs=M(sph(.56,24,18),skin);hs.scale.set(1,.95,.95);head.add(hs);
  [-1,1].forEach(s=>{const c=M(sph(.07,10,8),pink,s*.3,-.1,.42);c.scale.set(1,.6,.35);head.add(c);head.add(M(sph(.1,10,8),skin,s*.55,0,0))});
  const eyes=new THREE.Group();head.add(eyes);
  [-1,1].forEach(s=>{const x=s*.19,y=.03,z=.49;
    if(o.eyes==="sparkle"){const ir=M(sph(.115,14,10),basic("#6B3FD1"),x,y,z-.01);ir.scale.z=.6;eyes.add(ir);eyes.add(M(sph(.06,10,8),basic("#2A1B3D"),x,y-.01,z+.04));eyes.add(M(sph(.035,8,6),basic("#fff"),x+.04,y+.045,z+.07))}
    else if(o.eyes==="happy"){eyes.add(M(new THREE.TorusGeometry(.075,.024,8,16,PI),basic("#2A1B3D"),x,y-.02,z))}
    else{eyes.add(M(sph(.085,12,10),basic("#2A1B3D"),x,y,z));eyes.add(M(sph(.028,8,6),basic("#fff"),x+.03,y+.035,z+.07))}
  });
  const mouth=M(new THREE.TorusGeometry(.085,.02,8,14,PI),dark,0,-.15,.48);mouth.rotation.z=PI;head.add(mouth);
  if(o.hair!=="none"){
    const cap=M(sph(.6,24,12,0,PI*2,0,PI*.5),hairM);cap.rotation.x=-.35;head.add(cap);
    if(o.hair==="long")head.add(M(cyl(.6,.68,1.05,20,true,PI/2,PI),hairM,0,-.45,0));
    if(o.hair==="bob")head.add(M(cyl(.6,.63,.42,20,true,PI/2,PI),hairM,0,-.12,0));
    if(o.hair==="pigtails")[-1,1].forEach(s=>{const p=M(sph(.2,12,10),hairM,s*.66,-.12,-.08);p.scale.set(.9,1.25,.9);head.add(p)});
    if(o.hair==="bun")head.add(M(sph(.24,14,10),hairM,0,.56,-.22));
    if(o.hair==="curly"){head.add(M(sph(.2,10,8),hairM,0,.6,-.02));[[.3,6],[.6,10],[.9,12],[1.2,12]].forEach(([pol,n],i)=>{for(let j=0;j<n;j++){const az=j/n*PI*2+i*.3,x=Math.sin(pol)*Math.sin(az)*.63,y=Math.cos(pol)*.6+.03,z=Math.sin(pol)*Math.cos(az)*.63;if(z>.28&&pol>.8)continue;head.add(M(sph(.17,8,6),hairM,x,y,z))}})}
  }

function rectH(r,x,z){const t=r.axis==="x"?(x-r.x1)/(r.x2-r.x1):(z-r.z1)/(r.z2-r.z1);return r.ha+(r.hb-r.ha)*t}

function ground(x,z){let h=hillH(x,z);for(const r of ALLR){if(x<r.x1||x>r.x2||z<r.z1||z>r.z2)continue;const v=rectH(r,x,z);if(v>h)h=v}return h}

  else if(ev.k==="reset"){const u=MEU();if(u){Object.assign(u,{jailed:false,mustReturn:false,riding:false});u.c.position.set(ev.x,ground(ev.x,ev.z),ev.z);G.heroYaw=u.team==="red"?0:PI;G.camYaw=u.team==="red"?PI:0;u.c.rotation.y=G.heroYaw}Object.assign(G,{vy:0,grounded:true,jumps:0,sprintT:0,sprintCD:0,superT:0});C.phase="count";C.countT=4;snapCam()}
  else if(ev.k==="go"){const el=$("#count");el.textContent="GO!";el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");chime([784,1047,1568],.05,.4);setTimeout(()=>{if(el.textContent==="GO!")el.textContent=""},900);toast("Go! Grab their flag and bring it back to your side! 🚩",2600)}
  else if(ev.k==="cap"){toast(ev.m,3000);if(ev.win){confetti(24);chime([784,988,1175,1568],.08,.4)}else chime([523,440],.12,.3,"triangle",.1)}
  else if(ev.k==="end"){C.phase="over";const me=MEU(),b=ev.sc[0],r=ev.sc[1],win=me&&((me.team==="blue"&&b>r)||(me.team==="red"&&r>b));if(win){confetti(60);chime([523,659,784,1047,784,1047,1319,1568],.12,.5,"sine",.13)}else if(b!==r)chime([523,494,440,392],.15,.4,"triangle",.1);setTimeout(()=>showResults(ev.sc),1200)}
}
function showResults(sc){
  const me=MEU(),b=sc[0],r=sc[1],host=isHost();

/* ---------- match flow ---------- */
function plantFlag(tm,x,z){const f=flags[tm];f.home={x,z};f.x=x;f.z=z;f.carrier=null;f.dropped=false;f.dropT=0;f.mesh.visible=true;f.mesh.scale.setScalar(.01);f.ring.visible=true;f.ring.position.set(x,ground(x,z)+.07,z)}
function pickFlags(mi){const sp=MAPS[mi].flagSpots,b=sp[Math.floor(Math.random()*sp.length)],r=sp[Math.floor(Math.random()*sp.length)];return [[b[0],b[1]],[-r[0],-r[1]]]}
function tally(L){const v=[0,0,0,0];L.players.forEach(p=>{if(p.vote>=0&&p.vote<MAPS.length)v[p.vote]++});return v}
function leadingMap(L){const c=L.cfg||NET.cfg;if(c.mapMode==="host")return c.map;const v=tally(L),mx=Math.max(...v);if(mx===0)return c.map;return v.indexOf(mx)}
function pickMap(){const c=NET.cfg;if(c.mapMode==="host")return c.map;const v=tally({players:NET.players}),mx=Math.max(...v);if(mx===0)return c.map;const tied=v.map((n,i)=>n===mx?i:-1).filter(i=>i>=0);return tied[Math.floor(Math.random()*tied.length)]}
function freeSeat(){const cnt={blue:0,red:0};NET.players.forEach(p=>{if(p.idx>=0)cnt[ROSTER[p.idx].team]++});const order=cnt.blue<=cnt.red?["blue","red"]:["red","blue"];for(const tm of order){const i=ROSTER.findIndex((r,k)=>r.team===tm&&!NET.players.some(p=>p.idx===k));if(i>=0)return i}return -1}
function hostStart(){
  NET.players.forEach(p=>{if(p.idx<0)p.idx=freeSeat()});
  const mi=pickMap(),fl=pickFlags(mi);
  const assign=NET.players.filter(p=>p.idx>=0).map(p=>({id:p.id,name:p.name,idx:p.idx,look:p.look||null}));
  broadcast({t:"start",assign,fl,map:mi});startMatch(assign,fl,mi);
}
function startMatch(assign,fl,mi,mid){
  if(ED.mesh)closeEditor(true);
  buildMap(mi);
  units.forEach(u=>{u.human=null;u.pname="";u.net=null;u.tgt=null});
  assign.forEach(a=>{const u=units[a.idx];if(!u)return;u.human=a.id;u.pname=a.name;applyLook(u,a.look)});
  units.forEach(u=>{if(!u.human)applyLook(u,null);u.tagR=u.human?1.5:(ROSTER[u.i].tagR||1.15);setLabel(u);u.c.visible=true});
  C.me=units.findIndex(u=>u.human===NET.myId);
  Object.assign(C,{phase:"count",countT:5,time:240,score:{blue:0,red:0},puT:5});
  let bi=0,ri=0;
  units.forEach(u=>{Object.assign(u,{jailed:false,mustReturn:false,riding:false,ignoreNetT:0,immuneT:0,shieldT:0,frozenT:0,speedT:0,forceT:0,helpCD:0,sprintT:0,sprintCD:0,role:u.baseRole,carrying:null,think:0,waitT:2+Math.random()*5,stuckT:0,vy:0,wantSprint:false});
    const lp=linePos(u,u.team==="blue"?bi++:ri++),x=lp.x,z=lp.z;u.c.position.set(x,ground(x,z),z);confine(u);u.c.position.y=ground(u.c.position.x,u.c.position.z);u.c.rotation.y=u.team==="blue"?PI:0;u.tx=x;u.tz=z});
  ["blue","red"].forEach(tm=>Object.assign(COP[tm],{st:"idle",riders:[],path:[],tx:undefined}));
  plantFlag("blue",fl[0][0],fl[0][1]);plantFlag("red",fl[1][0],fl[1][1]);
  powerups.forEach(p=>FIELD.remove(p.obj));powerups.length=0;puId=0;
  const me=MEU();
  Object.assign(G,{camYaw:me&&me.team==="red"?PI:0,heroYaw:me&&me.team==="red"?0:PI,vy:0,grounded:true,jumps:0,superT:0,sprintT:0,sprintCD:0,manualT:0,lastKind:null,sliding:false});
  $("#screen").hidden=true;$("#ctfHud").hidden=false;$("#controls").hidden=false;$("#count").textContent="";G.playing=true;snapCam();
  if(mid&&me){me.c.position.set(mid[0],mid[1],mid[2]);me.c.rotation.y=mid[3];G.heroYaw=mid[3];snapCam();toast(`🔄 You’re in! You’re playing ${me.name} on the ${TNAME[me.team]} team.`,3200);return}
  if(me)toast(`You’re ${me.name} on the ${TNAME[me.team]} team in ${MAPS[mi].e} ${MAPS[mi].name}! Grab their flag and bring it back. First to 3 wins! 🚩`,4400);
}
function hideGame(){
  G.playing=false;C.phase="off";C.me=-1;units.forEach(u=>{u.c.visible=false});Object.values(flags).forEach(f=>{f.mesh.visible=false;f.ring.visible=false;f.home=null});
  powerups.forEach(p=>FIELD.remove(p.obj));powerups.length=0;
  ["blue","red"].forEach(tm=>{Object.assign(COP[tm],{st:"idle",riders:[],path:[]});copCars[tm].g.visible=false});cash.forEach(c=>FIELD.remove(c.sp));cash.length=0;
  $("#ctfHud").hidden=true;$("#controls").hidden=true;$("#redTint").classList.remove("on");$("#count").textContent="";
}
function backToLobby(){hideGame();NET.inLobby=true;renderLobby()}

/* ---------- host message handling ---------- */
function onHostMsg(id,m){
  const pl=NET.players.find(p=>p.id===id);
  if(m.t==="hello"){if(pl){pushLobby();return}hostHello(id,m);return}
  if(!pl)return;
  if(m.t==="pick"){if(!G.playing&&!NET.players.some(p=>p.idx===m.idx&&p.id!==id)&&m.idx>=0&&m.idx<ROSTER.length){pl.idx=m.idx;pl.look=m.look?cleanLook(m.look):null}pushLobby()}
  else if(m.t==="look"){if(m.idx===pl.idx&&m.look)pl.look=cleanLook(m.look);if(m.name)pl.name=String(m.name).slice(0,10);pushLobby()}
  else if(m.t==="vote"){if(m.m>=0&&m.m<MAPS.length)pl.vote=m.m;pushLobby()}
  else if(m.t==="in"){const u=units.find(x=>x.human===id);if(u&&!u.mustReturn&&!(u.ignoreNetT>0))u.net=m}
  else if(m.t==="act"&&m.k==="help"){callHelp(units.find(x=>x.human===id))}
}
function freeBotSeat(){const held=new Set(Object.values(NET.left).map(o=>o.idx)),cnt={blue:0,red:0};units.forEach(u=>{if(u.human)cnt[u.team]++});const order=cnt.blue<=cnt.red?["blue","red"]:["red","blue"];for(const pass of [0,1])for(const tm of order){const u=units.find(x=>x.team===tm&&!x.human&&(pass||!held.has(x.i)));if(u)return u.i}return -1}
function sendFull(id){const c=NET.conns[id];if(c){try{c.send({t:"full"})}catch(e){}setTimeout(()=>c.close(),300)}}
function hostHello(id,m){
  const nm=String(m.name||"Player").slice(0,10),key=nm.toLowerCase(),old=NET.left[key];
  if(NET.players.length>=14){sendFull(id);return}
  if(!G.playing){const idx=old&&!NET.players.some(p=>p.idx===old.idx)?old.idx:freeSeat();NET.players.push({id,name:nm,idx,vote:-1,look:old?old.look:null});delete NET.left[key];pushLobby();return}
  // a game is going: take back your own player if the computer is still playing it, otherwise any computer seat
  const idx=old&&units[old.idx]&&!units[old.idx].human?old.idx:freeBotSeat();
  if(idx<0){sendFull(id);return}
  const look=old&&old.idx===idx?old.look:null,back=!!(old&&old.idx===idx);delete NET.left[key];
  NET.players.push({id,name:nm,idx,vote:-1,look});
  const u=units[idx];u.human=id;u.pname=nm;u.tagR=1.5;u.net=null;u.ignoreNetT=.8;if(look)applyLook(u,look);setLabel(u);
  broadcast({t:"seat",idx,id,name:nm,look});
  const c=NET.conns[id],pos=u.c.position;
  if(c&&c.open)c.send({t:"start",mid:true,map:curMap,fl:[[flags.blue.home.x,flags.blue.home.z],[flags.red.home.x,flags.red.home.z]],
    assign:units.filter(x=>x.human).map(x=>({id:x.human,name:x.pname,idx:x.i,look:(NET.players.find(p=>p.id===x.human)||{}).look||null})),me:[pos.x,pos.y,pos.z,u.c.rotation.y]});
  NET.snapT=0;
  notifyAll({k:"toast",m:back?`🔄 ${nm} is back and took over ${u.name} again!`:`👋 ${nm} joined the game as ${u.name}!`,ms:2600});
  pushLobby();
}
function pushLobby(){const l={t:"lobby",cfg:Object.assign({},NET.cfg),players:NET.players.map(p=>({id:p.id,name:p.name,idx:p.idx,vote:p.vote,look:p.look||null})),code:NET.code};broadcast(l);NET.lobby=l;if(NET.inLobby&&!G.playing)renderLobby()}
function dropPlayer(id){
  const gone=NET.players.find(p=>p.id===id);if(!gone)return;
  NET.left[gone.name.toLowerCase()]={idx:gone.idx,look:gone.look||null};
  NET.players=NET.players.filter(p=>p.id!==id);delete NET.conns[id];
  const u=units.find(x=>x.human===id);
  if(u&&G.playing){const nm=u.pname||u.name;u.human=null;u.pname="";u.net=null;u.tagR=ROSTER[u.i].tagR||1.15;setLabel(u);broadcast({t:"seat",idx:u.i,id:null,name:"",look:null});notifyAll({k:"toast",m:`👋 ${nm} dropped out. The computer is playing ${u.name} until they come back.`,ms:2800})}
  pushLobby();
}

/* ---------- lobby & connections ---------- */
const PREFIX="herosdream-ctf-";
function rndCode(){return String(100+Math.floor(Math.random()*900))}
function myName(){const v=(($("#nameIn")||{}).value||"").trim().slice(0,10);try{if(v)localStorage.setItem("hsName",v)}catch(e){}return v||"Player"}
function netStatus(t){const el=$("#netStatus");if(el)el.textContent=t}
function hostGame(){
  if(!window.Peer){netStatus("Online play needs the internet connection library. Check your connection and reload.");return}
  const name=myName();netStatus("Creating your game…");
  const code=rndCode(),peer=new Peer(PREFIX+code);
  peer.on("open",()=>{Object.assign(NET,{mode:"host",peer,code,myId:"host",conns:{},inLobby:true,players:[{id:"host",name,idx:0,vote:-1,look:loadLook(0)}]});renderLobby();pushLobby()});
  peer.on("connection",c=>{c.on("open",()=>{NET.conns[c.peer]=c});c.on("data",m=>onHostMsg(c.peer,m));c.on("close",()=>dropPlayer(c.peer));c.on("error",()=>dropPlayer(c.peer))});
  peer.on("error",e=>{if(e.type==="unavailable-id"){peer.destroy();hostGame();return}netStatus(netErr(e))});
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
}
function joinGame(){
  if(!window.Peer){netStatus("Online play needs the internet connection library. Check your connection and reload.");return}
  const code=(($("#codeIn")||{}).value||"").replace(/\D/g,"");if(code.length!==3){netStatus("Type the 3-number code from the host.");return}
  const name=myName();netStatus("Connecting…");
  const peer=new Peer();
  peer.on("open",id=>{
    const c=peer.connect(PREFIX+code,{reliable:true});
    const to=setTimeout(()=>{if(!c.open){netStatus("Couldn’t reach that game. Check the code and try again.");peer.destroy()}},12000);
    c.on("open",()=>{clearTimeout(to);try{localStorage.setItem("ctfCode",code)}catch(e){}Object.assign(NET,{mode:"client",peer,code,myId:id,hostConn:c,inLobby:true});c.send({t:"hello",name});netStatus("")});
    c.on("data",onClientMsg);
    c.on("close",()=>hostLeft());
  });
  peer.on("error",e=>netStatus(netErr(e)));
}
function netErr(e){return e.type==="peer-unavailable"?"No game found with that code. Check the code and try again.":e.type==="network"||e.type==="server-error"||e.type==="socket-error"?"Can’t reach the game server. Check your internet and try again.":e.type==="browser-incompatible"?"This browser can’t play online. Try Chrome or Safari.":"Something went wrong connecting. Try again."}
function onClientMsg(m){
  if(m.t==="lobby"){NET.lobby=m;if(NET.inLobby&&!G.playing&&!ED.mesh)renderLobby()}
  else if(m.t==="start"){NET.inLobby=false;startMatch(m.assign,m.fl,m.map,m.mid?m.me:null)}
  else if(m.t==="seat"){const u=units[m.idx];if(u){u.human=m.id||null;u.pname=m.name||"";u.net=null;if(m.look)applyLook(u,m.look);else if(!m.id)applyLook(u,null);setLabel(u)}}
  else if(m.t==="s")applySnap(m);
  else if(m.t==="ev")handleEv(m);
  else if(m.t==="tolobby")backToLobby();
  else if(m.t==="full")netStatus("That game is full or already playing. Try again after this round.");
}
function hostLeft(){if(NET.mode!=="client")return;leave();toast("You got disconnected. Tap 🔑 Join to hop back in as your player!",4500)}
function leave(){try{if(NET.peer)NET.peer.destroy()}catch(e){}Object.assign(NET,{mode:"solo",peer:null,conns:{},hostConn:null,myId:"host",code:"",players:[],inLobby:false,lobby:null,cfg:{mapMode:"vote",map:0}});if(ED.mesh)closeEditor(true);hideGame();showMenu()}
function playSolo(){Object.assign(NET,{mode:"solo",myId:"host",code:"",inLobby:true,cfg:{mapMode:"host",map:NET.cfg.map||0},players:[{id:"host",name:myName(),idx:0,vote:-1,look:loadLook(0)}]});renderLobby()}
function curLobby(){return NET.mode==="client"?NET.lobby:{players:NET.players,code:NET.code,cfg:NET.cfg}}
function renderLobby(){
  const L=curLobby();if(!L)return;
  const mine=L.players.find(p=>p.id===NET.myId)||{};const host=isHost();
  const seat=i=>{const r=ROSTER[i],owner=L.players.find(p=>p.idx===i),me=owner&&owner.id===NET.myId;return `<button class="charbtn ${r.team}${me?" mine":""}" data-pick="${i}" ${owner&&!me?"disabled":""}><b>${r.name}</b><span>${me?"⭐ You":owner?esc(owner.name):"🤖 Computer"}</span></button>`};
  const team=tm=>ROSTER.map((r,i)=>r.team===tm?seat(i):"").join("");
  const head=NET.mode==="solo"?`<h1>Play solo</h1><p>Pick your character and a map. The computer plays everyone else.</p>`:`<h1>Code: <span class="code">${L.code}</span></h1><p>Friends tap “Join” and type this number.</p><div class="row2"><button class="ghostbtn" id="inviteBtn">📤 Share invite link</button></div>`;
  const cfg=L.cfg||NET.cfg,votes=tally(L),lead=leadingMap(L),solo=NET.mode==="solo";
  const modeChips=host&&!solo?`<div class="ed-chips gtype"><button data-mapmode="vote" class="${cfg.mapMode==="vote"?"on":""}">🗳️ Everyone votes</button><button data-mapmode="host" class="${cfg.mapMode==="host"?"on":""}">👑 I pick</button></div>`:"";
  const mapNote=solo?"":cfg.mapMode==="vote"?"Tap a map to vote. Most votes wins (a tie is picked at random).":host?"You’re picking the map.":"The host is picking the map.";
  const maps=MAPS.map((mp,i)=>{const on=cfg.mapMode==="vote"&&!solo?mine.vote===i:cfg.map===i;return `<button class="mapbtn${on?" on":""}${i===lead?" lead":""}" data-map="${i}"><span class="me">${mp.e}</span><b>${mp.name}</b><span>${mp.blurb}</span>${cfg.mapMode==="vote"&&!solo?`<i>${votes[i]?`🗳️ ${votes[i]}`:""}${i===lead&&votes[i]?" ⭐":""}</i>`:i===cfg.map?"<i>✅ Picked</i>":""}</button>`}).join("");
  showScreen(`<span class="script byline">Capture the Flag Online</span>${head}
  <h2>Pick your character</h2><p class="who">🔵 Blue team</p><div class="chargrid">${team("blue")}</div><p class="who">🔴 Red team</p><div class="chargrid">${team("red")}</div>
  ${mine.idx>=0?`<div class="row2"><button class="big" id="editBtn" style="background:#8E6CFF;box-shadow:0 6px 0 #6B3FD1">✏️ Edit my avatar</button></div>`:""}
  <h2>🗺️ Map</h2>${modeChips}<p class="who">${mapNote}</p><div class="mapgrid">${maps}</div>
  ${!solo?`<p class="who">${L.players.length} ${L.players.length===1?"player":"players"} here: ${L.players.map(p=>esc(p.name)).join(", ")}</p>`:""}
  ${host?`<button class="big" id="startBtn">▶️ Start the game</button><p class="who">Empty spots are played by the computer.</p>`:`<p><b>Waiting for the host to start…</b></p>`}
  <div class="row2"><button class="ghostbtn" id="leaveBtn">Leave</button></div>`);
  if(!G.playing)buildMap(lead);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showMenu(){

  <button class="ghostbtn" id="soloBtn">🎮 Play solo with computer players</button>

}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#hostBtn")){audioOn();hostGame();return}

  if(t.closest("#inviteBtn")){const url=location.origin+location.pathname+"?join="+NET.code;if(navigator.share)navigator.share({title:"Capture the Flag",text:`Come play Capture the Flag with me! Code: ${NET.code}`,url}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(url).then(()=>toast("Invite link copied! 📋")).catch(()=>toast(url,5000))}return}
});
$("#leaveTop").addEventListener("click",()=>{if(NET.mode==="solo"&&G.playing){backToLobby();return}leave()});

/* ---------- avatar editor ---------- */
const ED={look:null,mesh:null,idx:0};
const ED_SKIN=["#F6D5BE","#E8B48C","#E8934F","#C68642","#8D5524","#5A3825","#FFB36B","#9EE6A8","#B9A6FF","#7FD3FF"];
const ED_HAIRC=["#2B1B12","#6B3E1F","#C58B3A","#F4D06F","#DADAE6","#FF6FB5","#8E6CFF","#33C3F0","#FF7A3D"];
const ED_BONNET=["#C2185B","#8E6CFF","#33C3F0","#FFC23C","#2BCB8B"];
const ED_OPTS=[["hair","Hair",[["none","None"],["curly","Curly"],["bob","Bob"],["long","Long"],["pigtails","Pigtails"],["bun","Bun"]]],["eyes","Eyes",[["round","Round"],["sparkle","Sparkly"],["happy","Happy"]]],["glasses","Glasses",[["","None"],["round","Round"],["club","Clubmaster"]]],["outfit","Outfit",[["hoodie","Hoodie"],["tee","T-shirt"],["dress","Dress"]]],["scale","Size",[["0.85","Small"],["1","Medium"],["1.15","Tall"]]]];
function openEditor(){
  const L=curLobby();const me=L&&L.players.find(p=>p.id===NET.myId);if(!me||me.idx<0)return;
  ED.idx=me.idx;ED.look=cleanLook(me.look||loadLook(me.idx)||baseLook(me.idx));ED.name=me.name;
  $("#screen").hidden=true;$("#editor").hidden=false;renderEditor();buildPreview();
}
function buildPreview(){if(ED.mesh)FIELD.remove(ED.mesh);const ry=ED.mesh?ED.mesh.rotation.y:0;ED.mesh=makeChar(Object.assign({outfit:"hoodie"},ED.look,{outfitColor:TEAM[ROSTER[ED.idx].team].color}));ED.mesh.position.set(0,0,75);ED.mesh.rotation.y=ry;FIELD.add(ED.mesh)}
function closeEditor(silent){$("#editor").hidden=true;if(ED.mesh){FIELD.remove(ED.mesh);ED.mesh=null}if(!silent)renderLobby()}
function renderEditor(){
  const l=ED.look,team=ROSTER[ED.idx].team;
  const sw=(key,cols)=>`<div class="ed-sw">${cols.map(c=>`<button data-ed="${key}" data-v="${c}" style="background:${c}" class="${l[key]===c?"on":""}" aria-label="${c}"></button>`).join("")}</div>`;
  const chips=(key,opts)=>`<div class="ed-chips">${opts.map(o=>`<button data-ed="${key}" data-v="${o[0]}" class="${String(l[key]===undefined?"":l[key])===o[0]||(key==="scale"&&+o[0]===+l.scale)?"on":""}">${o[1]}</button>`).join("")}</div>`;
  $("#editor").innerHTML=`<div class="ed-head"><b>✏️ Design ${ROSTER[ED.idx].name} <span class="${team}">${team==="blue"?"🔵 Blue":"🔴 Red"} team</span></b><button class="ed-x" id="edClose" aria-label="Close">✕</button></div>
  <label class="ed-l">Your name<input class="field" id="edName" maxlength="10" value="${esc(ED.name||"")}"></label>
  <div class="ed-l">Skin</div>${sw("skin",ED_SKIN)}
  ${ED_OPTS.map(o=>`<div class="ed-l">${o[1]}</div>${chips(o[0],o[2])}`).join("")}
  <div class="ed-l">Hair color</div>${sw("hairColor",ED_HAIRC)}
  <div class="ed-l">Extras</div><div class="ed-chips"><button data-ed="belly" data-v="toggle" class="${l.belly?"on":""}">🫃 Big belly</button><button data-ed="bonnet" data-v="" class="${l.bonnet?"":"on"}">No bonnet</button></div>${sw("bonnet",ED_BONNET)}
  <p class="ed-note">Your outfit is always your team color. Saved on this phone.</p>
  <div class="row2"><button class="big" id="edSave">✅ Save my avatar</button><button class="ghostbtn" id="edReset">Reset</button></div>`;
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#editBtn")){openEditor();return}
  if(t.closest("#edClose")){closeEditor();return}
  if(t.closest("#edReset")){ED.look=cleanLook(baseLook(ED.idx));renderEditor();buildPreview();return}
  if(t.closest("#edSave")){const nm=($("#edName").value||"").trim().slice(0,10);if(nm){ED.name=nm;try{localStorage.setItem("hsName",nm)}catch(e){}}saveLook(ED.idx,ED.look);sendHost({t:"look",idx:ED.idx,look:ED.look,name:ED.name});toast("✅ Avatar saved!",1800);closeEditor();return}
  const b=t.closest("[data-ed]");if(b){const k=b.dataset.ed,v=b.dataset.v;
    if(k==="belly")ED.look.belly=!ED.look.belly;else if(k==="scale")ED.look.scale=+v;else if(k==="glasses"||k==="bonnet"){if(v)ED.look[k]=v;else delete ED.look[k]}else ED.look[k]=v;
    renderEditor();buildPreview()}
});

/* ---------- helpers ---------- */
function lerpAngle(a,b,t){const d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI;return a+d*Math.min(1,t)}
let toastT=0;
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.classList.add("on");toastT=(ms||2400)/1000}
function confetti(n){const box=$("#confetti"),em=["⭐","🩵","✨","💖","🌈","🚩"];for(let i=0;i<n;i++){const s=document.createElement("span");s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(2+Math.random()*2)+"s";s.style.animationDelay=Math.random()*1.2+"s";box.appendChild(s);setTimeout(()=>s.remove(),5000)}}
function showScreen(html){$("#screenCard").innerHTML=html;$("#screen").hidden=false}
let ac=null,soundOn=true;
function audioOn(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume()}
function tone(f,t0,dur,type,vol){if(!ac||!soundOn)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.12,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+dur+.05)}
function chime(fs,gap,dur,type,vol){if(!ac)return;const t=ac.currentTime;fs.forEach((f,i)=>tone(f,t+i*(gap||.07),dur||.25,type,vol))}
$("#soundBtn").onclick=()=>{soundOn=!soundOn;$("#soundBtn").textContent=soundOn?"🔊":"🔇"};

/* ---------- input ---------- */
const keys={};
const joy={id:null,ox:0,oy:0,x:0,y:0};
addEventListener("keydown",e=>{if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"))return;const k=e.key.toLowerCase();keys[k]=true;
  if(G.playing&&(k===" "||k.startsWith("arrow")))e.preventDefault();
  if(k===" "&&!e.repeat){jumpQueued=true;jumpHeld=true}
  if(k==="shift")sprint();if(k==="e")askHelp()});
addEventListener("keyup",e=>{const k=e.key.toLowerCase();keys[k]=false;if(k===" ")jumpHeld=false});
addEventListener("blur",()=>{Object.keys(keys).forEach(k=>keys[k]=false);jumpHeld=false});
let camDrag=null;
canvas.addEventListener("pointerdown",e=>{
  if(!G.playing)return;audioOn();
  if(e.pointerType!=="mouse"&&e.clientX<innerWidth*.5&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;const j=$("#joy");j.style.left=e.clientX+"px";j.style.top=e.clientY+"px";j.style.display="block";$("#knob").style.transform="";$("#joyHint").style.opacity="0";canvas.setPointerCapture(e.pointerId);return}
  camDrag={id:e.pointerId,x:e.clientX};canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),max=55;if(d>max){dx*=max/d;dy*=max/d}joy.x=dx/max;joy.y=dy/max;$("#knob").style.transform=`translate(${dx}px,${dy}px)`;return}
  if(camDrag&&e.pointerId===camDrag.id){G.camYaw-=(e.clientX-camDrag.x)*.008;G.manualT=1.8;camDrag.x=e.clientX}
});
function endPtr(e){if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;$("#joy").style.display="none"}if(camDrag&&e.pointerId===camDrag.id)camDrag=null}
canvas.addEventListener("pointerup",endPtr);canvas.addEventListener("pointercancel",endPtr);
const jb=$("#jumpBtn");
jb.addEventListener("pointerdown",e=>{e.preventDefault();audioOn();jumpQueued=true;jumpHeld=true;jb.classList.add("down")});
["pointerup","pointercancel","pointerleave"].forEach(ev=>jb.addEventListener(ev,()=>{jumpHeld=false;jb.classList.remove("down")}));
$("#sprintBtn").addEventListener("pointerdown",e=>{e.preventDefault();sprint()});
$("#helpBtn").addEventListener("pointerdown",e=>{e.preventDefault();askHelp()});
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- camera & main loop ---------- */
const camPos=new THREE.Vector3();
function camTarget(){const p=MEU().c.position,D=innerWidth<innerHeight?11:9.5,H=innerWidth<innerHeight?6:5.2;return new THREE.Vector3(p.x+Math.sin(G.camYaw)*D,p.y+H,p.z+Math.cos(G.camYaw)*D)}
function snapCam(){if(MEU()){camPos.copy(camTarget());camera.position.copy(camPos)}}
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;nowT=t;
  if(G.playing){if(isHost())hostUpdate(dt,t);else clientUpdate(dt,t);localUpdate(dt,t);visuals(dt,t);hud()}
  ctf.ff.material.opacity=.18+Math.sin(t*4)*.07;ctf.ffBars.forEach((b,i)=>b.position.y=(t*2+i*3)%9);
  $("#joyHint").hidden=!G.playing;$("#kbHint").hidden=!G.playing;
  if(ED.mesh){ED.mesh.rotation.y+=dt*.5;camera.position.set(0,2.6,80.5);camera.lookAt(0,-.4,75)}
  else if(G.playing&&MEU()){const ct=camTarget();camPos.lerp(ct,Math.min(1,6*dt));const gy=ground(camPos.x,camPos.z)+1.5;if(camPos.y<gy)camPos.y=gy;camera.position.copy(camPos);const p=MEU().c.position;camera.lookAt(p.x,p.y+2,p.z)}
  else{const a=t*.08;camera.position.set(Math.sin(a)*58,30,Math.cos(a)*58);camera.lookAt(0,0,0)}
  if(toastT>0){toastT-=dt;if(toastT<=0)$("#toast").classList.remove("on")}
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?68:58;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
